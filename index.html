                `<div id="cb-cash-type-group" style="${adminUnlocked ? 'display:none' : 'display:none'}"><div class="form-group"><label>Cash Type</label><select id="cb-cash-type"><option value="general">General Cash</option><option value="petty">Petty Cash</option></select></div></div>` +
                favChipsHtml +
                `<div class="form-group"><label>What was this money for? *</label><div class="ac-wrap"><input id="cb-cat" autocomplete="off" spellcheck="false" placeholder="Type to search..."><div id="cb-ac" class="ac-list" style="display:none;"></div></div><div id="cb-prev" class="text-muted" style="font-size:12px;margin-top:6px;">Start typing and pick from the list.</div></div>` +
                `<div class="form-group" id="cb-subcat-group" style="display:none;"><label>Item / Subcategory</label><select id="cb-subcat"></select></div>` +
                `<div id="cb-guest-group" style="display:none;">` +
                `<div class="form-group"><label>Guest <span class="text-muted" style="font-weight:400;">(optional — link this income to a member or non-member guest so it shows on their booking history and the dashboard)</span></label><div class="ac-wrap"><input id="cb-guest-input" autocomplete="off" spellcheck="false" placeholder="Search a guest, or leave blank..."><div id="cb-guest-list" class="ac-list" style="display:none;"></div></div><div id="cb-guest-preview" class="text-muted" style="font-size:12px;margin-top:4px;">Leave blank to just log the income without linking a guest.</div></div>` +
                `<div id="cb-nonmember-group" style="display:none;margin-bottom:12px;"><div class="form-group"><label>Guest Name *</label><input id="cb-nonmember-name" placeholder="Enter guest name..."></div></div>` +
                `</div>` +
                `<div class="form-group"><label>Amount (Rs.) *</label><input type="number" min="0" id="cb-amt" placeholder="e.g. 5000"></div>` +
                `<div class="form-group"><label>Note (optional)</label><input id="cb-desc" placeholder="e.g. Towels from Al-Karam, or June electricity bill"></div>` +
                `<div id="cb-auto-hint" class="text-muted" style="font-size:11px;margin-top:6px;padding:6px 10px;background:var(--surface-2);border-radius:var(--radius-sm);display:none;"></div>`;

            let selected = null;
            const ov = modal('💰 Add Cash Book Entry', b, function(ov) {
                const amt = parseFloat(ov.querySelector('#cb-amt').value);
                if (!selected) { alert('Please choose a category from the list.'); ov.querySelector('#cb-cat')
                        .focus(); return false; }
                if (!amt || amt <= 0) { alert('Please enter an amount greater than zero.'); return false; }
                const method = ov.querySelector('#cb-method').value;
                let cashType;
                if (adminUnlocked) {
                    cashType = ov.querySelector('#cb-cash-type').value;
                } else {
                    cashType = selected.dir === 'in' ? 'general' : 'petty';
                }
                const date = ov.querySelector('#cb-date').value;
                const month = getMonthFromDate(date);
                let finalDesc = ov.querySelector('#cb-desc').value.trim();
                if (subcatGroup.style.display !== 'none' && subcatSel.value) {
                    finalDesc = finalDesc ? (subcatSel.value + ' — ' + finalDesc) : subcatSel.value;
                }

                const linkingGuest = selected.label === 'Room income' && guestLinkId;
                let nonMemberName = '';
                if (linkingGuest && guestLinkId === 'nonmember') {
                    nonMemberName = ov.querySelector('#cb-nonmember-name').value.trim();
                    if (!nonMemberName) {
                        alert('Please enter the guest name for a non-member booking, or clear the guest field to skip linking.');
                        ov.querySelector('#cb-nonmember-name').focus();
                        return false;
                    }
                }

                if (!linkingGuest) {
                    postCashEntry(date, selected, amt, method, cashType, finalDesc, month);
                    return true;
                }

                // Linked to a member or non-member guest: post the cash entry silently, then
                // create a matching booking so it shows in guest history, Bookings, and the dashboard.
                const cbId = postCashEntry(date, selected, amt, method, cashType, finalDesc, month, true);
                const isNonMember = guestLinkId === 'nonmember';
                let g = null,
                    pts = 0;

                if (!isNonMember) {
                    g = byId(guests, parseInt(guestLinkId));
                    if (g) {
                        resetTierIfInactive(g);
                        pts = earnPointsForBooking(1);
                    }
                }

                const tx = {
                    id: Date.now(),
                    gId: isNonMember ? null : (g ? g.id : null),
                    date: date,
                    type: 'Room Revenue',
                    amount: amt,
                    desc: finalDesc || 'Room income',
                    pts: pts,
                    nights: 1,
                    nonMember: isNonMember,
                    nonMemberName: nonMemberName,
                    isCompany: false,
                    companyId: null,
                    companyName: '',
                    rooms: 1,
                    pricePerRoom: amt,
                    subtotal: amt,
                    discountPercent: 0,
                    discountApplied: 0,
                    paid: amt,
                    balance: 0,
                    cashEntryId: cbId
                };
                txs.unshift(tx);
                if (g) {
                    g.spend += amt;
                    g.points += pts;
                    g.nights = (g.nights || 0) + 1;
                    g.stays = (g.stays || 0) + 1;
                    g.lastVisit = date;
                }
                save();
                render();
                toast(isNonMember ? `Income recorded and linked to ${nonMemberName}.` :
                    `Income recorded. ${pts.toLocaleString()} points awarded to ${g?g.name:'guest'}.`);
                return true;
            });

            const methodSelect = ov.querySelector('#cb-method');
            const cashTypeGroup = ov.querySelector('#cb-cash-type-group');
            const autoHint = ov.querySelector('#cb-auto-hint');
            const subcatGroup = ov.querySelector('#cb-subcat-group');
            const subcatSel = ov.querySelector('#cb-subcat');
            const guestGroup = ov.querySelector('#cb-guest-group');
            const guestInput = ov.querySelector('#cb-guest-input');
            const guestList = ov.querySelector('#cb-guest-list');
            const guestPreview = ov.querySelector('#cb-guest-preview');
            const nonMemberGroup = ov.querySelector('#cb-nonmember-group');
            let guestLinkId = null; // null | 'nonmember' | <memberId>

            function updateGuestLinkUI(label) {
                if (label === 'Room income') {
                    guestGroup.style.display = 'block';
                } else {
                    guestGroup.style.display = 'none';
                    nonMemberGroup.style.display = 'none';
                    guestLinkId = null;
                    guestInput.value = '';
                    guestPreview.textContent = 'Leave blank to just log the income without linking a guest.';
                }
            }

            function renderGuestLinkAC() {
                const q = guestInput.value.toLowerCase().trim();
                let matches = [];
                matches.push({ label: '🚶 Non-member', id: 'nonmember' });
                guests.forEach(g => {
                    if (g.name.toLowerCase().indexOf(q) >= 0 || (g.phone && g.phone.indexOf(q) >= 0) || (g.email && g.email.toLowerCase().indexOf(q) >= 0)) {
                        matches.push({ label: g.name + ' (Member)', id: g.id });
                    }
                });
                guestList.innerHTML = matches.map(m => `<div class="ac-item" data-id="${m.id}"><span>${esc(m.label)}</span></div>`).join('');
                guestList.style.display = 'block';
                guestList.querySelectorAll('.ac-item').forEach(el => {
                    el.addEventListener('mousedown', function(ev) { ev.preventDefault();
                        chooseGuestLink(el.getAttribute('data-id')); });
                });
            }

            function chooseGuestLink(id) {
                guestLinkId = id;
                if (id === 'nonmember') {
                    guestInput.value = '🚶 Non-member';
                    guestPreview.innerHTML = 'Non-member — no points earned, but will still show as a booking.';
                    nonMemberGroup.style.display = 'block';
                } else {
                    const g = byId(guests, parseInt(id));
                    guestInput.value = g ? g.name + ' (Member)' : '';
                    guestPreview.innerHTML = g ? `Member — will earn ${earnRateLabel()} and count toward their stats.` : '';
                    nonMemberGroup.style.display = 'none';
                }
                guestList.style.display = 'none';
            }

            guestInput.addEventListener('focus', renderGuestLinkAC);
            guestInput.addEventListener('input', function() {
                guestLinkId = null;
                nonMemberGroup.style.display = 'none';
                renderGuestLinkAC();
            });
            guestInput.addEventListener('blur', function() { setTimeout(() => { guestList.style.display = 'none'; }, 150); });

            function updateSubcatUI(label) {
                const items = (label && subCategories[label]) ? subCategories[label] : null;
                if (items && items.length) {
                    subcatSel.innerHTML = '<option value="">— Select item (optional) —</option>' +
                        items.map(s => `<option value="${esc(s)}">${esc(s)}</option>`).join('');
                    subcatGroup.style.display = 'block';
                } else {
                    subcatSel.innerHTML = '';
                    subcatGroup.style.display = 'none';
                }
            }

            function updateCashTypeUI() {
                const method = methodSelect.value;
                if (adminUnlocked && method === 'cash') {
                    cashTypeGroup.style.display = 'block';
                    autoHint.style.display = 'none';
                } else {
                    cashTypeGroup.style.display = 'none';
                    if (!adminUnlocked && method === 'cash' && selected) {
                        const hintText = selected.dir === 'in' ?
                            '💡 Income → automatically posted to General Cash (staff mode)' :
                            '💡 Expense → automatically posted to Petty Cash (staff mode)';
                        autoHint.textContent = hintText;
                        autoHint.style.display = 'block';
                    } else {
                        autoHint.style.display = 'none';
                    }
                }
            }

            methodSelect.onchange = function() {
                updateCashTypeUI();
                if (selected) choose(selected.label);
            };

            const inp = ov.querySelector('#cb-cat'),
                list = ov.querySelector('#cb-ac'),
                prev = ov.querySelector('#cb-prev');

            function renderAC() {
                const q = inp.value.toLowerCase();
                let m = cats.filter(c => c.label.toLowerCase().indexOf(q) >= 0);
                if (!adminUnlocked) m = m.filter(c => c.reg === true);
                if (!m.length) {
                    list.innerHTML =
                        `<div class="ac-empty">${adminUnlocked?'No match. Try different keywords.':'No staff categories match. Unlock admin for more.'}</div>`;
                    list.style.display = 'block';
                    return;
                }
                list.innerHTML = m.map(c =>
                    `<div class="ac-item" data-label="${esc(c.label)}"><span>${esc(c.label)}</span><span class="ac-tag ${c.dir==='in'?'ac-in':'ac-out'}">${c.dir==='in'?'Money In':'Money Out'}</span></div>`
                ).join('');
                list.style.display = 'block';
                list.querySelectorAll('.ac-item').forEach(el => {
                    el.addEventListener('mousedown', function(ev) { ev.preventDefault();
                        choose(el.getAttribute('data-label')); });
                });
            }

            function choose(label) {
                selected = cats.find(c => c.label === label) || null;
                inp.value = label;
                list.style.display = 'none';
                updateSubcatUI(selected ? selected.label : null);
                updateGuestLinkUI(selected ? selected.label : null);
                if (selected) {
                    prev.innerHTML =
                        `<span style="color:${selected.dir==='in'?'var(--teal)':'var(--coral)'};font-weight:600;">${selected.dir==='in'?'Money In':'Money Out'}</span> → posts to ledger account: <strong>${esc(selected.account)}</strong> <span class="text-muted">(paid via ${esc(methodLabel(methodSelect.value, adminUnlocked ? (ov.querySelector('#cb-cash-type')?ov.querySelector('#cb-cash-type').value:'general') : (selected.dir==='in'?'general':'petty')))})</span>`;
                    if (!adminUnlocked) {
                        const hintText = selected.dir === 'in' ?
                            '💡 Income → automatically posted to General Cash (staff mode)' :
                            '💡 Expense → automatically posted to Petty Cash (staff mode)';
                        autoHint.textContent = hintText;
                        autoHint.style.display = 'block';
                    } else {
                        autoHint.style.display = 'none';
                    }
                    updateCashTypeUI();
                    if (adminUnlocked && methodSelect.value === 'cash') {
                        cashTypeGroup.style.display = 'block';
                    }
                }
            }
            inp.addEventListener('focus', renderAC);
            inp.addEventListener('input', function() { selected = null;
                updateSubcatUI(null);
                updateGuestLinkUI(null);
                renderAC(); });
            inp.addEventListener('blur', function() { setTimeout(() => { list.style.display = 'none'; }, 150); });

            ov.querySelectorAll('.fav-chip').forEach(chip => {
                chip.addEventListener('click', function() { choose(chip.getAttribute('data-label')); });
            });

            setTimeout(() => {
                updateCashTypeUI();
                if (adminUnlocked && methodSelect.value === 'cash') {
                    cashTypeGroup.style.display = 'block';
                }
                if (presetCategoryLabel) {
                    const match = cats.find(c => c.label === presetCategoryLabel);
                    if (match) choose(presetCategoryLabel);
                }
            }, 50);
        }

        function openCapitalInjection() {
            openCashEntry("Owner's Capital");
        }

        function openOwnerWithdrawal() {
            openCashEntry("Owner's Drawings");
        }

        // ─── MANAGE SUBCATEGORIES (admin) ──────────────────────
        function openManageSubcategories() {
            if (!adminUnlocked) {
                alert('Admin mode required to edit subcategories.');
                return;
            }
            const cats = getCashCategories();
            const inCats = cats.filter(c => c.dir === 'in');
            const outCats = cats.filter(c => c.dir === 'out');
            let opts = '';
            if (inCats.length) {
                opts += `<optgroup label="Money In (Revenue)">`;
                inCats.forEach(c => { opts += `<option value="${esc(c.label)}">${esc(c.label)}</option>`; });
                opts += `</optgroup>`;
            }
            if (outCats.length) {
                opts += `<optgroup label="Money Out (Expenses)">`;
                outCats.forEach(c => { opts += `<option value="${esc(c.label)}">${esc(c.label)}</option>`; });
                opts += `</optgroup>`;
            }
            const b =
                `<div class="alert alert-info">Add or edit the item list shown when a category is chosen in the Cash Book — works for revenue categories (Room income, Restaurant income, etc.) just as well as expense categories. Put one item per line — edit a line to rename it, delete a line to remove it, or add a new line. A category with no items here simply won't show a subcategory box. Changes save when you click Save.</div>` +
                `<div class="form-group"><label>Category</label><select id="sc-cat">${opts}</select></div>` +
                `<div class="form-group"><label>Items (one per line)</label><textarea id="sc-items" rows="10" style="width:100%;padding:10px;border:1px solid var(--border);border-radius:var(--radius-sm);font-family:inherit;font-size:14px;resize:vertical;background:var(--surface);color:var(--text);" placeholder="e.g. Weekday booking&#10;Weekend booking&#10;Corporate rate"></textarea></div>`;
            const ov = modal('🏷️ Edit Subcategories', b, function(ov) {
                work[currentKey] = readLines();
                // Drop empty lists so we don't accumulate clutter for categories that were only browsed, not edited.
                Object.keys(work).forEach(k => { if (!work[k] || !work[k].length) delete work[k]; });
                subCategories = work;
                saveSubCategories();
                toast('Subcategories updated.');
                return true;
            }, 'Save');
            const sel = ov.querySelector('#sc-cat');
            const ta = ov.querySelector('#sc-items');
            const work = JSON.parse(JSON.stringify(subCategories));
            let currentKey = sel.value;
            function readLines() {
                return ta.value.split('\n').map(s => s.trim()).filter(Boolean);
            }
            function loadKey(k) {
                currentKey = k;
                ta.value = (work[k] || []).join('\n');
            }
            sel.onchange = function() {
                work[currentKey] = readLines();
                loadKey(sel.value);
            };
            loadKey(currentKey);
        }

        function postCashEntry(date, cat, amt, method, cashType, desc, month, silent) {
            cbSeq++;
            try { localStorage.setItem('hms_cbseq', JSON.stringify(cbSeq)); } catch (e) {}
            const ref = 'CB-' + pad3(cbSeq),
                id = uid(),
                note = desc || cat.label;
            const cashAcct = methodAccountName(method, cashType);
            cashbook.unshift({
                id,
                seq: cbSeq,
                date,
                desc,
                catLabel: cat.label,
                account: cat.account,
                dir: cat.dir,
                method,
                amount: amt,
                ref,
                cashType: cashType || 'general',
                month: month,
                archived: false
            });
            if (cat.dir === 'in') {
                journal.unshift({ id: uid(), date, ref, account: cashAcct, desc: note, dr: amt, cr: 0,
                    source: 'cashbook', cbId: id });
                journal.unshift({ id: uid(), date, ref, account: cat.account, desc: note, dr: 0, cr: amt,
                    source: 'cashbook', cbId: id });
            } else {
                journal.unshift({ id: uid(), date, ref, account: cat.account, desc: note, dr: amt, cr: 0,
                    source: 'cashbook', cbId: id });
                journal.unshift({ id: uid(), date, ref, account: cashAcct, desc: note, dr: 0, cr: amt,
                    source: 'cashbook', cbId: id });
            }
            save();
            render();
            if (!silent) toast('Saved to cash book and posted to the ledger.');
            return id;
        }

        // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
        //  ADMIN
        // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
        // ─── ADMIN PASSCODE (sync-aware) ───────────────────────
        // If sync is on, the passcode lives in the shared file so it works
        // across all connected computers. This gate makes sure we don't
        // accidentally overwrite a shared passcode with a per-device one.
        async function adminGate(onOk) {
            // If sync is on, pull the freshest passcode from the file first
            // so a new device that just connected always sees the true value.
            if (syncState === 'on' && syncHandle) {
                try {
                    const snap = await syncReadFile();
                    if (snap && snap.data && snap.data.adminPass) {
                        adminPass = snap.data.adminPass;
                        try { localStorage.setItem('hms_adminpass', JSON.stringify(adminPass)); } catch (e) {}
                    }
                } catch (e) { /* fall through to whatever local state we have */ }
            }
            if (!adminPass) {
                openCreatePass(onOk, false);
            } else {
                openEnterPass(onOk);
            }
        }

        function openCreatePass(onOk, isChange) {
            let syncWarn = '';
            if (!isChange && syncState === 'on') {
                syncWarn = `<div class="alert alert-warning" style="margin-bottom:14px;"><strong>Heads up:</strong> The data file at "${esc(syncFileName || 'sync')}" doesn't contain an admin passcode yet, so you're setting the shared passcode for <strong>all connected computers</strong>. Anyone with this passcode will get admin access on every device that uses this data file. If someone else already set a passcode, cancel this and ask them for it instead.</div>`;
            }
            const intro = isChange ? 'Set a new admin passcode. This will replace the current passcode on every computer connected to this data file.' :
                (syncState === 'on' ?
                    'No admin passcode is set for this data file yet. Choose one now — it will be the same on every computer that connects to this file.' :
                    'Set an admin passcode. You\'ll need it to use the admin-only categories in the Cash Book, and to open the Chart of Accounts and Accounting Ledger.');
            const b =
                syncWarn +
                `<div class="alert alert-info" style="margin-bottom:14px;">${intro} Keep it safe — if forgotten, it can only be reset by clearing all data.</div>` +
                `<div class="form-group"><label>${isChange?'New passcode':'Passcode'}</label><input type="password" id="ap-new" autocomplete="new-password"></div>` +
                `<div class="form-group"><label>Confirm passcode</label><input type="password" id="ap-conf" autocomplete="new-password"></div>` +
                (!isChange ? `<div class="text-muted" style="font-size:12px;text-align:center;margin-top:8px;"><a href="#" id="ap-have" style="color:var(--teal);">I already have an admin passcode — enter it instead</a></div>` : '');
            const ov = modal(isChange ? '🔑 Change Admin Passcode' : '🔑 Create Admin Passcode', b, function(ov) {
                const p = ov.querySelector('#ap-new').value,
                    c = ov.querySelector('#ap-conf').value;
                if (!p || p.length < 3) { noticeModal('Please choose a passcode of at least 3 characters.', 'Passcode'); return false; }
                if (p !== c) { noticeModal('The two passcodes do not match.', 'Passcode'); return false; }
                adminPass = p;
                try { localStorage.setItem('hms_adminpass', JSON.stringify(p)); } catch (e) {}
                save();               // persists + triggers sync write so other devices pick it up
                adminUnlocked = true;
                if (onOk) onOk();
                return true;
            }, isChange ? 'Save passcode' : 'Create & unlock');
            const el = ov.querySelector('#ap-new');
            if (el) el.focus();
            const haveLink = ov.querySelector('#ap-have');
            if (haveLink) {
                haveLink.onclick = function(e) {
                    e.preventDefault();
                    if (document.body.contains(ov)) document.body.removeChild(ov);
                    // Give them the Enter flow — sync-aware so it can pull the shared one
                    openEnterPass(onOk, true);
                };
            }
        }

        // wrongAttempts tracks failed tries in the enter dialog, to offer recovery when sync is on.
        function openEnterPass(onOk, allowSyncRecovery) {
            let wrongAttempts = 0;
            const recoveryPossible = (syncState === 'on');
            const recoverBtn = recoveryPossible ?
                `<button type="button" id="ap-recover" class="btn btn-sm" style="margin-top:8px;display:none;">🔄 Refresh passcode from sync file</button>` : '';
            const b =
                `<div class="form-group"><label>Enter admin passcode</label><input type="password" id="ap-in" autocomplete="off"></div>` +
                `<div id="ap-err" style="font-size:12px;color:var(--coral);display:none;">Incorrect passcode. Please try again.</div>` +
                `<div id="ap-hint" style="font-size:12px;color:var(--text-secondary);display:none;margin-top:8px;">Still not working? If the passcode was set on another computer, this device may have an old value. Try refreshing from the sync file.</div>` +
                recoverBtn;
            const ov = modal('🔑 Admin Access', b, async function(ov) {
                const p = ov.querySelector('#ap-in').value;
                if (p !== adminPass) {
                    wrongAttempts++;
                    ov.querySelector('#ap-err').style.display = 'block';
                    if (recoveryPossible && wrongAttempts >= 2) {
                        ov.querySelector('#ap-hint').style.display = 'block';
                        const rb = ov.querySelector('#ap-recover'); if (rb) rb.style.display = 'inline-block';
                    }
                    const f = ov.querySelector('#ap-in');
                    f.value = '';
                    f.focus();
                    return false;
                }
                adminUnlocked = true;
                if (onOk) onOk();
                return true;
            }, 'Unlock');
            const el = ov.querySelector('#ap-in');
            if (el) el.focus();
            const rb = ov.querySelector('#ap-recover');
            if (rb) {
                rb.onclick = async function() {
                    rb.disabled = true;
                    rb.textContent = 'Refreshing…';
                    try {
                        const snap = await syncReadFile();
                        if (snap && snap.data && snap.data.adminPass) {
                            adminPass = snap.data.adminPass;
                            try { localStorage.setItem('hms_adminpass', JSON.stringify(adminPass)); } catch (e) {}
                            toast('Passcode refreshed from sync file. Try again.');
                            ov.querySelector('#ap-err').style.display = 'none';
                            ov.querySelector('#ap-hint').style.display = 'none';
                            rb.style.display = 'none';
                            const f = ov.querySelector('#ap-in'); if (f) f.focus();
                        } else {
                            toast('The sync file has no passcode set.');
                        }
                    } catch (e) {
                        toast('Could not read the sync file.');
                    }
                    rb.disabled = false;
                    rb.textContent = '🔄 Refresh passcode from sync file';
                };
            }
        }

        function unlockAdmin() { adminGate(function() { render();
                toast('Admin mode unlocked.'); }); }

        function lockAdmin() { adminUnlocked = false;
            render();
            toast('Admin mode locked.'); }

        function changePass() { openCreatePass(function() { render();
                toast('Admin passcode updated.'); }, true); }

        function lockedPage(which) {
            const name = which === 'coa' ? 'Chart of Accounts' : 'Accounting Ledger';
            let h =
                `<div class="info-box">This section holds your full accounting records and is available in admin mode only.</div>`;
            h +=
                `<div class="panel"><div class="panel-body" style="text-align:center;padding:48px 22px;"><div style="font-size:48px;margin-bottom:12px;">🔒</div><div style="font-size:18px;font-weight:700;margin-bottom:6px;">${name} is admin-only</div><div class="text-secondary" style="font-size:13px;margin-bottom:18px;">Enter the admin passcode to view this section.</div><button class="btn btn-gold" onclick="unlockAdmin()">🔓 Unlock with admin passcode</button></div></div>`;
            return h;
        }

        // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
        //  RESET (protected by admin)
        // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
        function openResetModal() {
            if (!adminUnlocked) {
                alert('Admin mode is required to clear all data. Please unlock admin first.');
                return;
            }
            const b =
                `<div class="alert alert-danger" style="margin-bottom:16px;">⚠️ This permanently deletes all ${guests.length} guest(s), ${txs.length} booking(s), ${cashbook.length} cash book entr(ies), and ${journal.length} ledger line(s). This cannot be undone. Consider exporting your data first.</div>` +
                `<div class="form-group"><label>To confirm, type <strong>ERASE ALL DATA</strong> exactly</label><input id="reset-confirm" placeholder="ERASE ALL DATA" autocomplete="off" spellcheck="false"></div>`;

            const ov = document.createElement('div');
            ov.className = 'modal-overlay';
            ov.innerHTML =
                `<div class="modal"><div class="modal-title" style="color:var(--coral);">🗑 Clear all data</div><div>${b}</div><div class="modal-footer"><button class="btn" id="r-cancel">Cancel</button><button class="btn" id="r-confirm" style="background:var(--coral);color:#fff;border-color:var(--coral);opacity:.45;cursor:not-allowed;">Erase everything</button></div></div>`;
            document.body.appendChild(ov);

            const input = ov.querySelector('#reset-confirm'),
                btn = ov.querySelector('#r-confirm');
            input.oninput = function() {
                const ok = input.value === 'ERASE ALL DATA';
                btn.style.opacity = ok ? '1' : '.45';
                btn.style.cursor = ok ? 'pointer' : 'not-allowed';
            };
            ov.querySelector('#r-cancel').onclick = function() { document.body.removeChild(ov); };
            ov.onclick = function(e) { if (e.target === ov) document.body.removeChild(ov); };
            btn.onclick = function() {
                if (input.value !== 'ERASE ALL DATA') { input.style.borderColor = 'var(--coral)';
                    input.focus(); return; }
                if (!confirm('Final check: erase everything and return to a clean slate?')) return;
                guests = [];
                txs = [];
                journal = [];
                cashbook = [];
                archivedCashbooks = {};
                cbSeq = 0;
                jeSeq = 0;
                selGuestId = null;
                coa = JSON.parse(JSON.stringify(BASE_COA));
                cashCategories = JSON.parse(JSON.stringify(DEFAULT_CASH_CATEGORIES));
                saveCashCategories();
                subCategories = JSON.parse(JSON.stringify(DEFAULT_SUBCATEGORIES));
                saveSubCategories();
                redeemRules = JSON.parse(JSON.stringify(DEFAULT_REDEEM_RULES));
                saveRedeemRules();
                companies = [];
                saveCompanies();
                reconciliations = [];
                saveReconciliations();
                saveCoa();
                try { localStorage.setItem('hms_cbseq', '0'); } catch (e) {}
                try { localStorage.setItem('hms_jeseq', '0'); } catch (e) {}
                save();
                document.body.removeChild(ov);
                page = 'dashboard';
                render();
                toast('All data cleared. Clean slate ready.');
            };
            input.focus();
        }

        // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
        //  EXPORT
        // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
        function dl(rows, fn) {
            // 1) Preferred: Blob URL. Anchor must be in the DOM, and the URL must not
            //    be revoked until the download has started, or browsers block it.
            try {
                const b = new Blob([rows], { type: 'text/csv;charset=utf-8' });
                const u = URL.createObjectURL(b);
                const a = document.createElement('a');
                a.href = u;
                a.download = fn;
                a.style.display = 'none';
                document.body.appendChild(a);
                a.click();
                setTimeout(() => {
                    document.body.removeChild(a);
                    URL.revokeObjectURL(u);
                }, 2000);
                toast('Downloaded ' + fn);
                return;
            } catch (e1) {
                // fall through
            }
            // 2) Fallback: data URI (works in some environments where blob: is blocked)
            try {
                const a = document.createElement('a');
                a.href = 'data:text/csv;charset=utf-8,' + encodeURIComponent(rows);
                a.download = fn;
                a.style.display = 'none';
                document.body.appendChild(a);
                a.click();
                setTimeout(() => { document.body.removeChild(a); }, 2000);
                toast('Downloaded ' + fn);
                return;
            } catch (e2) {
                // fall through
            }
            // 3) Last resort: show the content so it can be copied and saved manually
            dlFallbackModal(rows, fn);
        }

        function dlFallbackModal(rows, fn) {
            const b =
                `<div class="alert alert-info" style="margin-bottom:14px;">Your browser blocked the automatic download. Copy the report below and paste it into a file named <strong>${esc(fn)}</strong> (or into Excel).</div>` +
                `<div class="form-group"><textarea id="dl-content" rows="12" readonly style="width:100%;padding:10px;border:1px solid var(--border);border-radius:var(--radius-sm);font-family:monospace;font-size:12px;resize:vertical;background:var(--surface);color:var(--text);white-space:pre;">${esc(rows)}</textarea></div>`;
            const ov = modal('📄 ' + fn, b, function(ov) {
                const ta = ov.querySelector('#dl-content');
                ta.select();
                ta.setSelectionRange(0, ta.value.length);
                let ok = false;
                try { ok = document.execCommand('copy'); } catch (e) {}
                if (!ok && navigator.clipboard && navigator.clipboard.writeText) {
                    navigator.clipboard.writeText(ta.value).then(() => toast('Copied to clipboard.')).catch(() => {});
                    return false;
                }
                toast(ok ? 'Copied to clipboard.' : 'Select the text and copy it manually.');
                return false;
            }, 'Copy to Clipboard');
            const ta = ov.querySelector('#dl-content');
            ta.focus();
            ta.select();
        }

        function exportGuests() {
            if (!guests.length) { alert('No guests to export yet.'); return; }
            let r = 'Name,Phone,Email,SpendPKR,Points,Stays,LastVisit,JoinDate,Notes\n';
            guests.forEach(g => {
                r +=
                    `"${g.name}","${g.phone}","${g.email||''}",${g.spend},${g.points},${g.stays||0},"${g.lastVisit}","${g.joined}","${g.notes||''}"\n`;
            });
            dl(r, 'guests.csv');
        }

        function exportTx() {
            if (!txs.length) { alert('No bookings to export yet.'); return; }
            let r = 'Date,Guest,Type,Description,Nights,Rooms,PricePerRoom,Subtotal,DiscountApplied,AmountPKR,PaidPKR,BalancePKR,PointsEarned,NonMember,NonMemberName,Company\n';
            txs.forEach(t => {
                const guestName = bookingGuestName(t);
                r +=
                    `"${t.date}","${guestName}","${t.type}","${t.desc||''}",${t.nights||0},${t.rooms||1},${t.pricePerRoom||0},${t.subtotal||0},${t.discountApplied||0},${t.amount},${t.paid||0},${t.balance||0},${t.pts||0},"${t.nonMember?'Yes':'No'}","${t.nonMemberName||''}","${t.isCompany?(t.companyName||''):''}"\n`;
            });
            dl(r, 'bookings.csv');
        }

        // ─── EXPENSE REPORT (CSV) ──────────────────────────────
        function csvCell(v) {
            return '"' + String(v == null ? '' : v).replace(/"/g, '""') + '"';
        }

        function buildExpenseReportCSV(month) {
            const expenses = cashbook.filter(e =>
                e.dir === 'out' &&
                !e.isTransfer && !e.isReplenish &&
                !String(e.catLabel || '').startsWith('Transfer') &&
                getMonthFromDate(e.date) === month
            );
            const byCat = {};
            let grand = 0;
            expenses.forEach(e => {
                const k = e.catLabel || 'Uncategorised';
                if (!byCat[k]) byCat[k] = { count: 0, total: 0 };
                byCat[k].count++;
                byCat[k].total += e.amount;
                grand += e.amount;
            });
            const cats = Object.keys(byCat).sort((a, b) => byCat[b].total - byCat[a].total);
            let out = '';
            out += csvCell('Star Accommodations — Expense Report') + '\n';
            out += csvCell('Month:') + ',' + csvCell(month) + '\n';
            out += csvCell('Generated:') + ',' + csvCell(today()) + '\n';
            out += '\n';
            out += csvCell('Summary by Category') + '\n';
            out += ['Category', 'Entries', 'Total (PKR)'].map(csvCell).join(',') + '\n';
            cats.forEach(c => {
                out += [csvCell(c), csvCell(byCat[c].count), csvCell(byCat[c].total)].join(',') + '\n';
            });
            out += [csvCell('TOTAL'), csvCell(expenses.length), csvCell(grand)].join(',') + '\n';
            out += '\n';
            out += csvCell('Detailed Expenses') + '\n';
            out += ['Date', 'Category', 'Account', 'Reference', 'Description', 'Amount (PKR)'].map(csvCell).join(',') + '\n';
            const sorted = expenses.slice().sort((a, b) => {
                const ca = a.catLabel || '', cb = b.catLabel || '';
                if (ca !== cb) return ca < cb ? -1 : 1;
                if (a.date !== b.date) return a.date < b.date ? -1 : 1;
                return (a.seq || 0) - (b.seq || 0);
            });
            sorted.forEach(e => {
                out += [csvCell(e.date), csvCell(e.catLabel || ''), csvCell(e.account || ''), csvCell(e.ref || ''), csvCell(e.desc || ''), csvCell(e.amount)].join(',') + '\n';
            });
            return { csv: out, count: expenses.length, grand: grand };
        }

        function getExpenseMonths() {
            const current = getCurrentMonth();
            const seen = {};
            cashbook.forEach(e => {
                if (e.dir !== 'out') return;
                if (e.isTransfer || e.isReplenish) return;
                if (String(e.catLabel || '').startsWith('Transfer')) return;
                seen[getMonthFromDate(e.date)] = true;
            });
            seen[current] = true; // always allow the current month
            return Object.keys(seen).sort((a, b) => monthSortKey(b) - monthSortKey(a));
        }

        function openExpenseReport() {
            if (!adminUnlocked) { noticeModal('Admin mode required to download the expense report.', 'Admin required'); return; }
            const months = getExpenseMonths();
            const opts = months.map(m => `<option value="${esc(m)}">${esc(m)}</option>`).join('');
            const b =
                `<div class="alert alert-info" style="margin-bottom:14px;">Choose the month to export. The CSV lists all expenses for that month, grouped by category with totals.</div>` +
                `<div class="form-group"><label>Month</label><select id="er-month">${opts}</select></div>` +
                `<div id="er-summary" class="text-secondary" style="font-size:12px;"></div>`;
            const ov = modal('📄 Expense Report', b, function(ov) {
                const month = ov.querySelector('#er-month').value;
                const res = buildExpenseReportCSV(month);
                if (!res.count) { noticeModal(`No expenses recorded for ${month}.`, 'Expense Report'); return false; }
                dl(res.csv, 'expense-report-' + month.replace('/', '-') + '.csv');
                return true;
            }, 'Download CSV');
            const sel = ov.querySelector('#er-month');
            const summary = ov.querySelector('#er-summary');
            function upd() {
                const res = buildExpenseReportCSV(sel.value);
                summary.textContent = res.count ?
                    `${res.count} expense ${res.count === 1 ? 'entry' : 'entries'} · ${PKR(res.grand)} total` :
                    'No expenses recorded for this month.';
            }
            sel.onchange = upd;
            upd();
        }

        function exportCashbook() {
            if (!cashbook.length) { alert('No cash book entries yet.'); return; }
            const s = cashbook.slice().sort((a, b) => { if (a.date !== b.date) return a.date < b.date ? -1 : 1; return a
                    .seq - b.seq; });
            let r = 'Date,Ref,Note,Category,Direction,Account,AmountPKR,LedgerAccount,Month,Archived\n';
            s.forEach(e => {
                const acct = methodLabel(e.method, e.cashType);
                r +=
                    `"${e.date}","${e.ref}","${e.desc||''}","${e.catLabel}","${e.dir==='in'?'Money In':'Money Out'}","${acct}",${e.amount},"${e.account}","${e.month||''}","${e.archived?'Yes':'No'}"\n`;
            });
            dl(r, 'cashbook.csv');
        }

        function exportJournal() {
            if (!journal.length) { alert('No ledger lines to export yet.'); return; }
            let r = 'Date,Ref,Account,Description,DebitPKR,CreditPKR,Source\n';
            journal.forEach(j => {
                r +=
                    `"${j.date}","${j.ref||''}","${j.account}","${j.desc||''}",${j.dr},${j.cr},"${j.source||'manual'}"\n`;
            });
            dl(r, 'ledger.csv');
        }

        // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
        //  INIT
        // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
        render();
    </script>
</body>
</html>
