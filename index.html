<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Star Accommodations · Loyalty & Accounting</title>

    <!-- PWA -->
    <link rel="manifest" href="manifest.webmanifest" />
    <meta name="theme-color" content="#14213d" />
    <meta name="description"
        content="Star Accommodations — Guest registry, bookings, cash book and accounting for small hotels." />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Star Hotel" />
    <link rel="apple-touch-icon" href="icon-192.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="icon-192.png" />
    <link rel="icon" type="image/png" sizes="512x512" href="icon-512.png" />
    <link rel="icon" type="image/svg+xml" href="icon.svg" />

    <!-- Styles (design system, split by concern) -->
    <link rel="stylesheet" href="css/01-tokens.css" />
    <link rel="stylesheet" href="css/02-layout.css" />
    <link rel="stylesheet" href="css/03-components.css" />
    <link rel="stylesheet" href="css/04-app.css" />
    <link rel="stylesheet" href="css/05-responsive.css" />

    <!-- Icons -->
    <!-- <link href="https://cdn.lineicons.com/5.1/line/lineicons.css" rel="stylesheet" /> -->
    <script type="module" src="https://unpkg.com/ionicons@8.0.13/dist/ionicons/ionicons.esm.js"></script>
    <script nomodule src="https://unpkg.com/ionicons@8.0.13/dist/ionicons/ionicons.js"></script>

    <script src="js/sw-register.js"></script>
</head>

<body>
    <div class="app">
        <!-- Sidebar Overlay (mobile) -->
        <div class="sidebar-overlay" id="sidebar-overlay" onclick="toggleSidebar()"></div>

        <!-- Sidebar -->
        <div class="sidebar" id="sidebar">
            <div class="sidebar-logo">
                <h1>Star <span class="star">★</span> Accommodations</h1>
                <p>Loyalty &amp; Accounting Suite</p>
            </div>
            <div class="sidebar-nav" id="nav"></div>
            <!-- <div class="sidebar-foot">All amounts in PKR (Rs.)<br />Data auto-saved in browser</div> -->
        </div>

        <!-- Main -->
        <div class="main">
            <!-- Topbar -->
            <div class="topbar">
                <div class="flex gap-8" style="align-items:center;">
                    <button class="hamburger" onclick="toggleSidebar()">☰</button>
                    <div class="topbar-title" id="page-title">Dashboard</div>
                </div>
                <div class="topbar-right">
                    <span class="sync-badge" id="sync-badge" onclick="syncBadgeClick()" style="display:none;"
                        title="Sync status">🔄 Synced</span>
                    <span class="topbar-pts" id="top-pts"><ion-icon name="star"></ion-icon> 0 pts</span>
                    <span class="topbar-meta" id="top-meta"></span>
                    <button class="theme-toggle" onclick="toggleTheme()" title="Toggle dark mode"><ion-icon name="moon"></ion-icon></button>
                </div>
            </div>

            <!-- Content -->
            <div class="content" id="content"></div>
        </div>
    </div>

    <!-- Admin toggle (floating) -->
    <button class="btn btn-admin-toggle" id="adminToggleBtn" onclick="toggleAdminFromButton()">🔓 Admin Access</button>

    <!-- Toast -->
    <div class="toast" id="toast"></div>

    <!-- App logic, split by concern. Order matters: state/config first,
         then sync, core/render, each page module, then action handlers,
         and finally init (which triggers the first render). -->
    <script src="js/00-state.js"></script>
    <script src="js/01-sync.js"></script>
    <script src="js/02-core.js"></script>
    <script src="js/03-dashboard.js"></script>
    <script src="js/04-bookings.js"></script>
    <script src="js/05-guests.js"></script>
    <script src="js/06-loyalty.js"></script>
    <script src="js/07-analytics.js"></script>
    <script src="js/08-cashbook.js"></script>
    <script src="js/09-accounting.js"></script>
    <script src="js/10-coa.js"></script>
    <script src="js/11-settings.js"></script>
    <script src="js/12-actions.js"></script>
    <script src="js/13-admin-modal.js"></script>
    <script src="js/14-petty-cash.js"></script>
    <script src="js/15-transfer-bank.js"></script>
    <script src="js/16-guest-booking.js"></script>
    <script src="js/17-journal.js"></script>
    <script src="js/18-cash-categories.js"></script>
    <script src="js/19-admin.js"></script>
    <script src="js/20-reset-export.js"></script>
    <script src="js/21-init.js"></script>
</body>

</html>
