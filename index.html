<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Star Accommodations · Loyalty & Accounting</title>
    <!-- PWA -->
    <link rel="manifest" href="manifest.webmanifest" />
    <meta name="theme-color" content="#0f6e56" />
    <meta name="description" content="Star Accommodations — Guest registry, bookings, cash book and accounting for small hotels." />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Star Hotel" />
    <link rel="apple-touch-icon" href="icon-192.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="icon-192.png" />
    <link rel="icon" type="image/png" sizes="512x512" href="icon-512.png" />
    <link rel="icon" type="image/svg+xml" href="icon.svg" />
    <script>
        // Register service worker for offline support and installability.
        // Service workers are blocked entirely under file:// by browser security
        // policy — this is expected when double-clicking index.html, not an error.
        // Everything else in the app works normally either way.
        if (location.protocol === 'file:') {
            console.info('Star Accommodations: running from a local file (file://). ' +
                'Offline caching and "Install as app" need the file to be served over ' +
                'http:// or https:// (e.g. host it, or run a local server) — everything ' +
                'else in the app works normally without this.');
        } else if ('serviceWorker' in navigator) {
            window.addEventListener('load', function() {
                navigator.serviceWorker.register('sw.js').catch(function(err) {
                    console.warn('Service worker registration failed:', err);
                });
            });
        }
    </script>
    <style>
        /* ── Reset & Variables ── */
        *,
        *::before,
        *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        :root {
            --bg: #f1f0ec;
            --surface: #ffffff;
            --surface-2: #f7f6f2;
            --border: #e3dfd6;
            --border-strong: #cbc6ba;
            --text: #1a1a18;
            --text-secondary: #5f5e58;
            --text-muted: #9b9a92;
            --shadow: 0 2px 12px rgba(0, 0, 0, .06);
            --radius: 14px;
            --radius-sm: 8px;
            --transition: .2s ease;

            --gold: #c9a84c;
            --gold-light: #f5edd4;
            --gold-dark: #8b6914;
            --navy: #1b2a4a;
            --navy-light: #2d4070;
            --teal: #0f6e56;
            --teal-light: #e1f5ee;
            --coral: #d85a30;
            --coral-light: #faede7;
            --purple: #7f77dd;
            --purple-light: #eeedfe;
            --red: #c0202a;
            --red-light: #f9e6e7;

            --sidebar-width: 232px;
            --topbar-height: 56px;
        }

        /* Dark mode */
        [data-theme="dark"] {
            --bg: #14141a;
            --surface: #1e1e26;
            --surface-2: #282834;
            --border: #2e2e3e;
            --border-strong: #3e3e50;
            --text: #eaeaea;
            --text-secondary: #b0b0ba;
            --text-muted: #7a7a88;
            --shadow: 0 2px 12px rgba(0, 0, 0, .4);
            --gold-light: #2a2418;
            --teal-light: #132a24;
            --coral-light: #2a1a14;
            --purple-light: #1e1c3a;
            --red-light: #2a1418;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, system-ui, sans-serif;
            background: var(--bg);
            color: var(--text);
            font-size: 14px;
            line-height: 1.5;
            transition: background var(--transition), color var(--transition);
        }

        /* ── Scrollbar ── */
        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }
        ::-webkit-scrollbar-track {
            background: transparent;
        }
        ::-webkit-scrollbar-thumb {
            background: var(--border-strong);
            border-radius: 8px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: var(--text-muted);
        }

        /* ── App Layout ── */
        .app {
            display: flex;
            min-height: 100vh;
        }

        /* ── Sidebar ── */
        .sidebar {
            width: var(--sidebar-width);
            background: var(--navy);
            position: fixed;
            top: 0;
            left: 0;
            height: 100vh;
            overflow-y: auto;
            z-index: 100;
            display: flex;
            flex-direction: column;
            transition: transform var(--transition);
        }
        .sidebar-logo {
            padding: 18px 18px 14px;
            border-bottom: 1px solid rgba(255, 255, 255, .08);
            background: var(--red);
            flex-shrink: 0;
        }
        .sidebar-logo h1 {
            color: #fff;
            font-size: 16px;
            font-weight: 700;
            letter-spacing: .4px;
        }
        .sidebar-logo .star {
            color: var(--gold);
        }
        .sidebar-logo p {
            color: rgba(255, 255, 255, .7);
            font-size: 11px;
            margin-top: 2px;
        }
        .sidebar-nav {
            flex: 1;
            padding: 10px 0 20px;
        }
        .nav-section {
            font-size: 10px;
            color: rgba(255, 255, 255, .25);
            font-weight: 700;
            letter-spacing: 1.4px;
            text-transform: uppercase;
            padding: 16px 20px 6px;
        }
        .nav-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 9px 20px;
            cursor: pointer;
            color: rgba(255, 255, 255, .55);
            font-size: 13px;
            transition: all .15s;
            border-left: 3px solid transparent;
            position: relative;
        }
        .nav-item:hover {
            background: rgba(255, 255, 255, .06);
            color: #fff;
        }
        .nav-item.active {
            background: var(--gold);
            color: var(--navy);
            font-weight: 600;
            border-left-color: #fff;
        }
        .nav-item .nav-ico {
            width: 20px;
            text-align: center;
            flex-shrink: 0;
            font-size: 16px;
        }
        .nav-item .nav-lock {
            margin-left: auto;
            font-size: 11px;
            opacity: .4;
        }
        .sidebar-foot {
            padding: 14px 20px;
            border-top: 1px solid rgba(255, 255, 255, .06);
            font-size: 11px;
            color: rgba(255, 255, 255, .3);
            line-height: 1.6;
            flex-shrink: 0;
        }

        /* ── Main ── */
        .main {
            flex: 1;
            margin-left: var(--sidebar-width);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* ── Topbar ── */
        .topbar {
            background: var(--surface);
            border-bottom: .5px solid var(--border);
            padding: 0 24px;
            height: var(--topbar-height);
            display: flex;
            align-items: center;
            justify-content: space-between;
            position: sticky;
            top: 0;
            z-index: 50;
            transition: background var(--transition), border var(--transition);
        }
        .topbar-title {
            font-size: 17px;
            font-weight: 700;
        }
        .topbar-right {
            display: flex;
            align-items: center;
            gap: 14px;
        }
        .sync-badge {
            background: var(--teal-light);
            color: var(--teal);
            font-size: 12px;
            font-weight: 700;
            padding: 4px 12px;
            border-radius: 30px;
            cursor: pointer;
            border: 1px solid transparent;
            transition: opacity 0.2s;
        }
        .sync-badge:hover { opacity: 0.85; }
        .sync-badge.pending {
            background: var(--coral-light);
            color: var(--coral);
            border-color: var(--coral);
        }
        .topbar-pts {
            background: var(--gold-light);
            color: var(--gold-dark);
            font-size: 12px;
            font-weight: 700;
            padding: 4px 14px;
            border-radius: 30px;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .topbar-meta {
            font-size: 12px;
            color: var(--text-secondary);
        }
        .theme-toggle {
            background: var(--surface-2);
            border: .5px solid var(--border);
            border-radius: 30px;
            width: 36px;
            height: 36px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            font-size: 16px;
            color: var(--text-secondary);
            transition: all var(--transition);
        }
        .theme-toggle:hover {
            background: var(--border);
        }

        /* ── Content ── */
        .content {
            padding: 24px;
            flex: 1;
        }

        /* ── Cards / Panels ── */
        .card {
            background: var(--surface);
            border: .5px solid var(--border);
            border-radius: var(--radius);
            padding: 16px 18px;
            transition: background var(--transition), border var(--transition), box-shadow var(--transition);
            box-shadow: var(--shadow);
        }
        .card-label {
            font-size: 11px;
            color: var(--text-secondary);
            font-weight: 500;
            text-transform: uppercase;
            letter-spacing: .5px;
            margin-bottom: 4px;
        }
        .card-value {
            font-size: 26px;
            font-weight: 700;
            line-height: 1.2;
        }
        .card-sub {
            font-size: 12px;
            color: var(--text-muted);
            margin-top: 2px;
        }

        .panel {
            background: var(--surface);
            border: .5px solid var(--border);
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            transition: background var(--transition), border var(--transition);
        }
        .panel-0 {
            padding: 0;
            overflow: hidden;
        }
        .panel-head {
            padding: 14px 18px;
            border-bottom: .5px solid var(--border);
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        .panel-body {
            padding: 16px 18px;
        }

        .sec-title {
            font-size: 15px;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 14px;
        }
        .sec-title .ic {
            color: var(--gold);
        }

        /* ── Grids ── */
        .grid-2 {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 16px;
        }
        .grid-3 {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 16px;
        }
        .grid-4 {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 14px;
        }
        @media (max-width: 900px) {
            .grid-4 {
                grid-template-columns: 1fr 1fr;
            }
            .grid-3 {
                grid-template-columns: 1fr 1fr;
            }
        }
        @media (max-width: 640px) {
            .grid-2,
            .grid-3,
            .grid-4 {
                grid-template-columns: 1fr;
            }
            .sidebar {
                transform: translateX(-100%);
            }
            .sidebar.open {
                transform: translateX(0);
            }
            .main {
                margin-left: 0;
            }
            .topbar {
                padding: 0 14px;
            }
            .content {
                padding: 14px;
            }
            .topbar-meta {
                display: none;
            }
        }
        .hamburger {
            display: none;
            background: none;
            border: none;
            font-size: 22px;
            cursor: pointer;
            color: var(--text);
            padding: 4px;
        }
        @media (max-width: 640px) {
            .hamburger {
                display: block;
            }
            .sidebar-overlay {
                display: none;
                position: fixed;
                inset: 0;
                background: rgba(0, 0, 0, .35);
                z-index: 99;
            }
            .sidebar-overlay.active {
                display: block;
            }
        }

        /* ── Info Box ── */
        .info-box {
            background: var(--navy);
            color: #fff;
            border-radius: var(--radius-sm);
            padding: 12px 16px;
            margin-bottom: 20px;
            font-size: 13px;
            line-height: 1.6;
        }
        .info-box strong {
            font-weight: 700;
            color: var(--gold);
        }
        .info-box a {
            color: var(--gold-light);
        }
        [data-theme="dark"] .info-box {
            background: #1a1a2e;
        }

        /* ── Tables ── */
        .tbl-wrap {
            overflow-x: auto;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 13px;
        }
        th {
            text-align: left;
            padding: 10px 14px;
            color: var(--text-secondary);
            font-weight: 600;
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: .5px;
            border-bottom: .5px solid var(--border);
            background: var(--surface-2);
        }
        td {
            padding: 10px 14px;
            border-bottom: .5px solid var(--border);
            vertical-align: middle;
        }
        tr:last-child td {
            border-bottom: none;
        }
        tbody tr:hover td {
            background: var(--surface-2);
        }
        tfoot td {
            background: var(--navy);
            color: #fff;
            font-weight: 700;
        }
        [data-theme="dark"] tfoot td {
            background: #1a1a2e;
        }

        /* ── Badges ── */
        .tier-badge {
            display: inline-block;
            padding: 3px 10px;
            border-radius: 30px;
            font-size: 11px;
            font-weight: 700;
        }
        .tier-member {
            background: var(--gold-light);
            color: var(--gold-dark);
        }

        .pts-chip {
            display: inline-block;
            background: var(--gold-light);
            color: var(--gold-dark);
            padding: 2px 10px;
            border-radius: 30px;
            font-size: 12px;
            font-weight: 700;
        }
        [data-theme="dark"] .pts-chip {
            background: #2a2418;
            color: #e8d08a;
        }

        /* ── Buttons ── */
        .btn {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 8px 16px;
            border-radius: var(--radius-sm);
            font-size: 13px;
            font-weight: 500;
            cursor: pointer;
            border: .5px solid var(--border-strong);
            background: var(--surface);
            color: var(--text);
            transition: all .15s;
            font-family: inherit;
            box-shadow: var(--shadow);
        }
        .btn:hover {
            background: var(--surface-2);
            transform: translateY(-1px);
        }
        .btn-primary {
            background: var(--navy);
            color: #fff;
            border-color: var(--navy);
        }
        .btn-primary:hover {
            background: var(--navy-light);
        }
        .btn-gold {
            background: var(--gold);
            color: var(--navy);
            border-color: var(--gold-dark);
            font-weight: 700;
        }
        .btn-gold:hover {
            background: var(--gold-dark);
            color: #fff;
        }
        .btn-sm {
            padding: 5px 12px;
            font-size: 12px;
        }
        .btn-teal {
            background: var(--teal-light);
            color: var(--teal);
            border-color: var(--teal);
            font-weight: 600;
        }
        .btn-danger {
            background: var(--surface);
            color: var(--coral);
            border-color: var(--coral);
        }
        .btn-danger:hover {
            background: var(--coral-light);
        }
        .btn-ghost {
            background: transparent;
            border-color: transparent;
            box-shadow: none;
        }
        .btn-ghost:hover {
            background: var(--surface-2);
        }
        .btn-outline-gold {
            background: transparent;
            color: var(--gold-dark);
            border-color: var(--gold);
        }
        .btn-outline-gold:hover {
            background: var(--gold-light);
        }
        .btn-admin-toggle {
            position: fixed;
            bottom: 24px;
            right: 24px;
            z-index: 150;
            background: var(--navy);
            color: #fff;
            border-color: var(--navy);
            border-radius: 50px;
            padding: 10px 20px;
            box-shadow: 0 4px 16px rgba(0, 0, 0, .2);
        }
        .btn-admin-toggle:hover {
            background: var(--navy-light);
        }
        .btn-admin-toggle.admin-active {
            background: var(--coral);
            border-color: var(--coral);
        }

        /* ── Forms ── */
        input,
        select,
        textarea {
            width: 100%;
            padding: 8px 12px;
            border: .5px solid var(--border-strong);
            border-radius: var(--radius-sm);
            font-size: 13px;
            background: var(--surface);
            color: var(--text);
            font-family: inherit;
            outline: none;
            transition: border var(--transition), box-shadow var(--transition);
        }
        input:focus,
        select:focus,
        textarea:focus {
            border-color: var(--gold);
            box-shadow: 0 0 0 3px rgba(201, 168, 76, .15);
        }
        label {
            font-size: 12px;
            font-weight: 600;
            color: var(--text-secondary);
            margin-bottom: 4px;
            display: block;
        }
        .form-group {
            margin-bottom: 14px;
        }
        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }
        @media (max-width: 480px) {
            .form-row {
                grid-template-columns: 1fr;
            }
        }

        /* ── Alerts ── */
        .alert {
            padding: 10px 14px;
            border-radius: var(--radius-sm);
            font-size: 13px;
        }
        .alert-success {
            background: var(--teal-light);
            color: var(--teal);
            border: .5px solid rgba(15, 110, 86, .2);
        }
        .alert-warning {
            background: #faee da;
            color: #ba7517;
            border: .5px solid rgba(186, 117, 23, .2);
        }
        .alert-danger {
            background: var(--coral-light);
            color: var(--coral);
            border: .5px solid rgba(216, 90, 48, .2);
        }
        .alert-info {
            background: var(--navy-mid);
            color: var(--navy);
            border: .5px solid rgba(27, 42, 74, .15);
        }
        [data-theme="dark"] .alert-warning {
            background: #2a2218;
            color: #e8b84a;
        }
        [data-theme="dark"] .alert-info {
            background: #1a1a2e;
            color: #b0b0ca;
        }

        /* ── Progress ── */
        .prog-wrap {
            background: var(--surface-2);
            border-radius: 30px;
            height: 6px;
            overflow: hidden;
            margin-top: 4px;
        }
        .prog-bar {
            height: 100%;
            border-radius: 30px;
            transition: width .4s ease;
        }

        /* ── Tabs ── */
        .tab-bar {
            display: flex;
            gap: 4px;
            margin-bottom: 18px;
            background: var(--surface-2);
            padding: 4px;
            border-radius: var(--radius-sm);
            width: fit-content;
            border: .5px solid var(--border);
        }
        .tab {
            padding: 7px 18px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 13px;
            color: var(--text-secondary);
            font-weight: 500;
            transition: all .15s;
        }
        .tab.active {
            background: var(--surface);
            color: var(--text);
            box-shadow: var(--shadow);
        }
        .tab:hover:not(.active) {
            background: rgba(0, 0, 0, .04);
        }
        [data-theme="dark"] .tab:hover:not(.active) {
            background: rgba(255, 255, 255, .04);
        }

        /* ── Stat rows ── */
        .stat-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 8px 0;
            border-bottom: .5px solid var(--border);
            font-size: 13px;
        }
        .stat-row:last-child {
            border-bottom: none;
        }

        /* ── Modal ── */
        .modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, .5);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 200;
            backdrop-filter: blur(4px);
            animation: fadeIn .2s ease;
        }
        .modal {
            background: var(--surface);
            border-radius: var(--radius);
            padding: 28px 32px;
            width: 580px;
            max-width: 94vw;
            max-height: 86vh;
            overflow-y: auto;
            box-shadow: 0 12px 48px rgba(0, 0, 0, .2);
            animation: slideUp .25s ease;
            transition: background var(--transition);
        }
        @keyframes fadeIn {
            from {
                opacity: 0;
            }
            to {
                opacity: 1;
            }
        }
        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        .modal-title {
            font-size: 18px;
            font-weight: 700;
            margin-bottom: 18px;
        }
        .modal-footer {
            display: flex;
            gap: 10px;
            justify-content: flex-end;
            margin-top: 20px;
            padding-top: 16px;
            border-top: .5px solid var(--border);
        }

        /* ── Chart bars ── */
        .chart-bars {
            display: flex;
            align-items: flex-end;
            gap: 10px;
            height: 140px;
            padding-top: 6px;
        }
        .bar-col {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
        }
        .bar-rect {
            width: 100%;
            border-radius: 4px 4px 0 0;
            min-height: 4px;
            background: var(--gold);
            transition: height .4s ease;
        }
        .bar-lbl {
            font-size: 10px;
            color: var(--text-muted);
        }
        .bar-val {
            font-size: 10px;
            color: var(--text-secondary);
            font-weight: 600;
        }

        /* ── COA ── */
        .coa-card {
            background: var(--surface);
            border: .5px solid var(--border);
            border-radius: var(--radius-sm);
            margin-bottom: 8px;
            overflow: hidden;
            transition: background var(--transition);
        }
        .coa-hdr {
            padding: 12px 16px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            cursor: pointer;
            font-weight: 600;
        }
        .coa-hdr:hover {
            background: var(--surface-2);
        }
        .coa-body {
            padding: 0 16px 14px;
        }
        .coa-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 7px 0;
            border-bottom: .5px solid var(--border);
            font-size: 13px;
        }
        .coa-item:last-child {
            border-bottom: none;
        }
        .debit-val {
            color: var(--teal);
            font-weight: 600;

        function migrateCoa() {
            let updated = false;
            if (!coa.Assets) return;

            // Rename 'Cash on Hand' to 'General Cash'
            const cashOnHand = coa.Assets.accts.find(a => a.name === 'Cash on Hand');
            if (cashOnHand) {
                cashOnHand.name = 'General Cash';
                updated = true;
            }

            // Add 'Petty Cash' if it doesn't exist
            if (!coa.Assets.accts.find(a => a.name === 'Petty Cash')) {
                coa.Assets.accts.push({ code: '1001.1', name: 'Petty Cash', type: 'debit' });
                updated = true;
            }

            // Rename 'Bank Account - HBL' to 'Bank Account'
            const hblAcct = coa.Assets.accts.find(a => a.name === 'Bank Account - HBL');
            if (hblAcct) {
                hblAcct.name = 'Bank Account';
                updated = true;
            } else if (!coa.Assets.accts.find(a => a.name === 'Bank Account')) {
                coa.Assets.accts.push({ code: '1002', name: 'Bank Account', type: 'debit' });
                updated = true;
            }

            // Add 'Credit Card Account' if it doesn't exist (for the Credit Card payment method)
            if (!coa.Assets.accts.find(a => a.name === 'Credit Card Account')) {
                coa.Assets.accts.push({ code: '1003', name: 'Credit Card Account', type: 'debit', opening: 0 });
                updated = true;
            }

            // Add 'Cash Over / Short' if it doesn't exist (used by the cash reconciliation helper)
            if (coa['Operating Expenses'] && !coa['Operating Expenses'].accts.find(a => a.name === 'Cash Over / Short')) {
                coa['Operating Expenses'].accts.push({ code: '6802', name: 'Cash Over / Short', type: 'debit', opening: 0 });
                updated = true;
            }

            // Ensure no duplicate codes (just in case)
            const codes = coa.Assets.accts.map(a => a.code);
            if (new Set(codes).size !== codes.length) {
                // Remove duplicates, keeping the first occurrence
                const seen = new Set();
                coa.Assets.accts = coa.Assets.accts.filter(a => {
                    if (seen.has(a.code)) return false;
                    seen.add(a.code);
                    return true;
                });
                updated = true;
            }

            // Ensure every account has an opening-balance field (migration for older installs)
            for (const sec in coa) {
                coa[sec].accts.forEach(a => {
                    if (typeof a.opening !== 'number') { a.opening = 0; updated = true; }
                });
            }

            if (updated) {
                saveCoa();
            }
        }

        // Central place to compute balances by payment method — avoids each caller
        // re-deriving this (which is exactly how a card/company entry once got
        // miscounted as "general cash" in one spot but not another).
        function computeCashBalances() {
            let generalCash = 0,
                pettyCash = 0,
                bankBal = 0,
                cardBal = 0,
                companyBal = 0;
            cashbook.forEach(e => {
                if (e.method === 'bank') bankBal += e.dir === 'in' ? e.amount : -e.amount;
                else if (e.method === 'card') cardBal += e.dir === 'in' ? e.amount : -e.amount;
                else if (e.method === 'company') companyBal += e.dir === 'in' ? e.amount : -e.amount;
                else if (e.cashType === 'petty') pettyCash += e.dir === 'in' ? e.amount : -e.amount;
                else generalCash += e.dir === 'in' ? e.amount : -e.amount;
            });
            return { generalCash, pettyCash, bankBal, cardBal, companyBal };
        }

        // ─── REPORTING PERIODS (QuickBooks-style) ──────────────
        // Income Statement reports activity DURING a period; Balance Sheet reports
        // position AS OF a date. These helpers keep that distinction correct.
        function getPeriodRange() {
            const now = new Date();
            const y = now.getFullYear(),
                m = now.getMonth();
            const fmt = d => d.getFullYear() + '-' + ('0' + (d.getMonth() + 1)).slice(-2) + '-' + ('0' + d.getDate()).slice(-2);
            switch (acctPeriod) {
                case 'this-month':
                    return { from: fmt(new Date(y, m, 1)), to: fmt(new Date(y, m + 1, 0)), label: 'This Month' };
                case 'last-month':
                    return { from: fmt(new Date(y, m - 1, 1)), to: fmt(new Date(y, m, 0)), label: 'Last Month' };
                case 'this-quarter': {
                    const q = Math.floor(m / 3);
                    return { from: fmt(new Date(y, q * 3, 1)), to: fmt(new Date(y, q * 3 + 3, 0)), label: 'This Quarter' };
                }
                case 'this-year':
                    return { from: fmt(new Date(y, 0, 1)), to: fmt(new Date(y, 11, 31)), label: 'This Year' };
                case 'custom':
                    return { from: acctFrom, to: acctTo, label: 'Custom Range' };
                default:
                    return { from: '', to: '', label: 'All Time' };
            }
        }

        function inRange(dateStr, from, to) {
            if (from && dateStr < from) return false;
            if (to && dateStr > to) return false;
            return true;
        }

        // Net balance of one account within a date window.
        // includeOpening: true for Balance Sheet (position as-of), false for P&L period activity.
        function accountNetRange(a, orientation, from, to, includeOpening) {
            let net = includeOpening ? (a.opening || 0) : 0;
            journal.forEach(j => {
                if (j.account !== a.name) return;
                if (!inRange(j.date, from, to)) return;
                net += orientation === 'debit' ? (j.dr - j.cr) : (j.cr - j.dr);
            });
            return net;
        }

        function sectionTotalRange(sectionName, orientation, from, to, includeOpening) {
            if (!coa[sectionName]) return 0;
            let total = 0;
            coa[sectionName].accts.forEach(a => { total += accountNetRange(a, orientation, from, to, includeOpening); });
            return total;
        }

        function accountHasActivity(a, from, to, includeOpening) {
            if (includeOpening && (a.opening || 0) !== 0) return true;
            return journal.some(j => j.account === a.name && inRange(j.date, from, to));
        }

        // Net balance of one account, oriented so a positive number means "normal side" for the given orientation.
        function accountNet(a, orientation) {
            let net = a.opening || 0;
            journal.forEach(j => { if (j.account === a.name) net += orientation === 'debit' ? (j.dr - j.cr) : (j.cr - j.dr); });
            return net;
        }

        // Total of a whole COA section, oriented the same way (contra accounts within the section net out naturally).
        function sectionTotal(sectionName, orientation) {
            if (!coa[sectionName]) return 0;
            let total = 0;
            coa[sectionName].accts.forEach(a => { total += accountNet(a, orientation); });
            return total;
        }

        // ─── RECEIVABLES (who owes us money) ───────────────────
        function getReceivables() {
            const open = txs.filter(t => (t.balance || 0) > 0 && !t.redemption);
            const groups = {};
            const todayStr = today();
            open.forEach(t => {
                const key = t.isCompany ? 'co:' + (t.companyId || t.companyName) :
                    (t.nonMember ? 'nm:' + (t.nonMemberName || 'Non-member') : 'g:' + t.gId);
                if (!groups[key]) {
                    groups[key] = { name: bookingGuestName(t), kind: t.isCompany ? 'Company' : (t.nonMember ? 'Non-member' : 'Member'), total: 0, current: 0, d30: 0, d60: 0, d90: 0, items: [] };
                }
                const days = Math.floor((new Date(todayStr) - new Date(t.date)) / 86400000);
                const bal = t.balance;
                groups[key].total += bal;
                if (days <= 30) groups[key].current += bal;
                else if (days <= 60) groups[key].d30 += bal;
                else if (days <= 90) groups[key].d60 += bal;
                else groups[key].d90 += bal;
                groups[key].items.push({ date: t.date, days, bal, desc: t.desc, id: t.id });
            });
            return Object.keys(groups).map(k => groups[k]).sort((a, b) => b.total - a.total);
        }

        function bookingGuestName(tx) {

            const g = byId(guests, tx.gId);

        //  SYNC ACROSS COMPUTERS (data file in Dropbox / Google Drive)
        //  Uses the File System Access API (Chrome / Edge).
        // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
        let syncHandle = null;          // FileSystemFileHandle
        let syncState = 'off';          // 'off' | 'pending' (handle stored, needs user click) | 'on'
        let syncFileName = '';
        let lastSyncSavedAt = '';
        let syncWriteTimer = null;

        // Tiny IndexedDB helpers (file handles can persist in IndexedDB, not localStorage)
        function idbOpen() {
            return new Promise((res, rej) => {
                const rq = indexedDB.open('hms_sync', 1);
                rq.onupgradeneeded = () => rq.result.createObjectStore('kv');
                rq.onsuccess = () => res(rq.result);
                rq.onerror = () => rej(rq.error);
            });
        }
        async function idbSet(key, val) {
            const db = await idbOpen();
            return new Promise((res, rej) => {
                const tx = db.transaction('kv', 'readwrite');
                tx.objectStore('kv').put(val, key);
                tx.oncomplete = () => res();
                tx.onerror = () => rej(tx.error);
            });
        }
        async function idbGet(key) {
            const db = await idbOpen();
            return new Promise((res, rej) => {
                const tx = db.transaction('kv', 'readonly');
                const rq = tx.objectStore('kv').get(key);
                rq.onsuccess = () => res(rq.result);
                rq.onerror = () => rej(rq.error);
            });
        }
        async function idbDel(key) {
            const db = await idbOpen();
            return new Promise((res, rej) => {
                const tx = db.transaction('kv', 'readwrite');
                tx.objectStore('kv').delete(key);
                tx.oncomplete = () => res();
                tx.onerror = () => rej(tx.error);
            });
        }

        function buildSyncSnapshot() {
            return {
                _meta: { app: 'star-accommodations', version: 1, savedAt: new Date().toISOString() },
                data: {
                    guests, txs, journal, cashbook, cbSeq, jeSeq,
                    archivedCashbooks, verifiers, tiers, coa,
                    cashCategories, subCategories, redeemRules, adminPass, companies, reconciliations
                }
            };
        }

        function applySyncSnapshot(snap) {
            if (!snap || !snap.data) return false;
            const d = snap.data;
            guests = d.guests || [];
            txs = d.txs || [];
            journal = d.journal || [];
            cashbook = d.cashbook || [];
            cbSeq = d.cbSeq || 0;
            jeSeq = d.jeSeq || 0;
            archivedCashbooks = d.archivedCashbooks || {};
            verifiers = d.verifiers || ['AQ', 'NM'];
            tiers = d.tiers || JSON.parse(JSON.stringify(DEFAULT_TIERS));
            coa = d.coa || JSON.parse(JSON.stringify(BASE_COA));
            cashCategories = d.cashCategories || JSON.parse(JSON.stringify(DEFAULT_CASH_CATEGORIES));
            subCategories = d.subCategories || JSON.parse(JSON.stringify(DEFAULT_SUBCATEGORIES));
            redeemRules = d.redeemRules || JSON.parse(JSON.stringify(DEFAULT_REDEEM_RULES));
            companies = d.companies || [];

            try {
                localStorage.setItem('hms_cbseq', JSON.stringify(cbSeq));
                localStorage.setItem('hms_jeseq', JSON.stringify(jeSeq));
                if (adminPass) localStorage.setItem('hms_adminpass', JSON.stringify(adminPass));
            } catch (e) {}
            saveSubCategories();
            saveRedeemRules();
            saveCompanies();
            saveReconciliations();
            save();  // persists everything else to localStorage (and re-writes the file, which is harmless)
            return true;
        }

        function scheduleSyncWrite() {
            if (syncState !== 'on' || !syncHandle) return;
            clearTimeout(syncWriteTimer);
            syncWriteTimer = setTimeout(syncWriteNow, 800);
        }

        async function syncWriteNow() {
            if (syncState !== 'on' || !syncHandle) return;
            try {
                const w = await syncHandle.createWritable();
                const snap = buildSyncSnapshot();
                await w.write(JSON.stringify(snap, null, 1));
                await w.close();
                lastSyncSavedAt = new Date().toLocaleString();
                lastSyncWroteAtMs = Date.now();
                lastKnownFileSavedAt = snap._meta.savedAt;
                updateSyncBadge();
            } catch (e) {
                // Losing write access mid-session: fall back to pending so the user can reconnect
                syncState = 'pending';
                updateSyncBadge();
                toast('⚠ Could not save to data file — click Settings to reconnect.');
            }
        }

        // Auto-poll the data file every ~30s and reload if another computer has updated it.
        let syncPollTimer = null;
        let lastSyncWroteAtMs = 0;
        let lastKnownFileSavedAt = '';
        const SYNC_POLL_INTERVAL_MS = 30000;
        const SYNC_SELF_WRITE_QUIET_MS = 5000; // don't pull within N ms of our own write

        async function syncPollOnce() {
            if (syncState !== 'on' || !syncHandle) return;
            // Skip if a modal is open — the user may be entering data.
            if (document.querySelector('.modal-overlay')) return;
            // Skip if we ourselves wrote very recently (would just pull our own write back).
            if (Date.now() - lastSyncWroteAtMs < SYNC_SELF_WRITE_QUIET_MS) return;
            let snap;
            try { snap = await syncReadFile(); } catch (e) { return; }
            if (!snap || !snap.data || !snap._meta || !snap._meta.savedAt) return;
            if (snap._meta.savedAt === lastKnownFileSavedAt) return;
            // Only reload if the file is genuinely newer than what we know.
            const localSaved = loadOr('hms_last_saved', null);
            if (localSaved && new Date(snap._meta.savedAt) <= new Date(localSaved)) {
                lastKnownFileSavedAt = snap._meta.savedAt;
                return;
            }
            // Apply the newer snapshot silently.
            lastKnownFileSavedAt = snap._meta.savedAt;
            applySyncSnapshot(snap);
            render();
            const when = new Date(snap._meta.savedAt).toLocaleTimeString();
            toast('Updated from ' + syncFileName + ' (saved ' + when + ').');
        }

        function startSyncPolling() {
            stopSyncPolling();
            syncPollTimer = setInterval(syncPollOnce, SYNC_POLL_INTERVAL_MS);
        }

        function stopSyncPolling() {
            if (syncPollTimer) { clearInterval(syncPollTimer); syncPollTimer = null; }
        }

        async function syncPermission(handle, ask) {
            try {
                let p = await handle.queryPermission({ mode: 'readwrite' });
                if (p === 'granted') return true;
                if (ask) {
                    p = await handle.requestPermission({ mode: 'readwrite' });
                    return p === 'granted';
                }
            } catch (e) {}
            return false;
        }

        async function syncReadFile() {
            const f = await syncHandle.getFile();
            const text = await f.text();
            if (!text.trim()) return null;
            try { return JSON.parse(text); } catch (e) { return undefined; } // undefined = unreadable
        }

        async function syncActivate(handle, isNew) {
            syncHandle = handle;
            syncFileName = handle.name || 'data file';
            try { await idbSet('handle', handle); } catch (e) {}
            if (isNew) {
                syncState = 'on';
                await syncWriteNow();
                updateSyncBadge();
                render();
                noticeModal(`Connected to <strong>${esc(syncFileName)}</strong>. Your current data has been saved into it. From now on, every change saves to this file automatically.<br><br>On your other computers, open this app and use <strong>📂 Connect existing file</strong> to pick the same file from your Dropbox / Google Drive folder.`, '🔄 Sync enabled');
                return;
            }
            // Existing file: decide which side's data wins
            const snap = await syncReadFile();
            if (snap === undefined) {
                noticeModal('That file exists but doesn\'t look like a Star Accommodations data file. Pick the correct file, or use "Create data file" to start a new one.', 'Sync');
                syncHandle = null;
                try { await idbDel('handle'); } catch (e) {}
                return;
            }
            if (snap === null) { // empty file — treat as new
                syncState = 'on';
                await syncWriteNow();
                updateSyncBadge();
                render();
                toast('Connected. Current data saved to ' + syncFileName + '.');
                return;
            }
            const fileWhen = snap._meta && snap._meta.savedAt ? new Date(snap._meta.savedAt).toLocaleString() : 'unknown time';
            const localWhen = (loadOr('hms_last_saved', null)) ? new Date(loadOr('hms_last_saved', null)).toLocaleString() : 'unknown time';
            const fileCounts = snap.data ? `${(snap.data.guests||[]).length} guests, ${(snap.data.txs||[]).length} bookings, ${(snap.data.cashbook||[]).length} cash entries` : '';
            const b =
                `<div class="alert alert-info" style="margin-bottom:14px;">This file already contains data. Choose which data to keep — the other will be replaced.</div>` +
                `<div class="stat-row"><span class="text-secondary">In the file (saved ${esc(fileWhen)})</span><span style="font-weight:600;">${esc(fileCounts)}</span></div>` +
                `<div class="stat-row" style="margin-bottom:12px;"><span class="text-secondary">On this computer (saved ${esc(localWhen)})</span><span style="font-weight:600;">${guests.length} guests, ${txs.length} bookings, ${cashbook.length} cash entries</span></div>` +
                `<div class="flex gap-8" style="flex-wrap:wrap;"><button class="btn btn-gold" id="sync-usefile">⬇ Use the file's data</button><button class="btn btn-primary" id="sync-uselocal">⬆ Keep this computer's data</button></div>`;
            const ov = modal('🔄 Connect data file', b, function() { return true; }, 'Cancel');
            if (ov._saveBtn) ov._saveBtn.style.display = 'none';
            if (ov._cancelBtn) ov._cancelBtn.textContent = 'Cancel';
            ov.querySelector('#sync-usefile').onclick = async function() {
                applySyncSnapshot(snap);
                syncState = 'on';
                if (document.body.contains(ov)) document.body.removeChild(ov);
                updateSyncBadge();
                render();
                toast('Loaded data from ' + syncFileName + '. Sync is on.');
            };
            ov.querySelector('#sync-uselocal').onclick = async function() {
                syncState = 'on';
                await syncWriteNow();
                if (document.body.contains(ov)) document.body.removeChild(ov);
                updateSyncBadge();
                render();
                toast('This computer\'s data saved to ' + syncFileName + '. Sync is on.');
            };
        }

        async function syncCreateFile() {
            if (!window.showSaveFilePicker) { openSyncInstructions(); return; }
            try {
                const handle = await window.showSaveFilePicker({
                    suggestedName: 'star-accommodations-data.json',
                    types: [{ description: 'Star Accommodations data', accept: { 'application/json': ['.json'] } }]
                });
                await syncActivate(handle, true);
            } catch (e) { /* user cancelled */ }
        }

        async function syncConnectExisting() {
            if (!window.showOpenFilePicker) { openSyncInstructions(); return; }
            try {
                const handles = await window.showOpenFilePicker({
                    types: [{ description: 'Star Accommodations data', accept: { 'application/json': ['.json'] } }]
                });
                if (!handles || !handles[0]) return;
                const ok = await syncPermission(handles[0], true);
                if (!ok) { noticeModal('Permission to read/write the file was not granted.', 'Sync'); return; }
                await syncActivate(handles[0], false);
            } catch (e) { /* user cancelled */ }
        }

        async function syncReconnect() {
            if (!syncHandle) {
                try { syncHandle = await idbGet('handle'); } catch (e) {}
            }
            if (!syncHandle) { syncState = 'off'; updateSyncBadge(); render(); return; }
            const ok = await syncPermission(syncHandle, true);
            if (!ok) { toast('Permission not granted.'); return; }
            syncFileName = syncHandle.name || 'data file';
            const snap = await syncReadFile();
            if (snap && snap.data) {
                await syncActivate(syncHandle, false);
            } else {
                syncState = 'on';
                await syncWriteNow();
                updateSyncBadge();
                render();
                toast('Reconnected to ' + syncFileName + '.');
            }
        }

        async function syncLoadFromFile() {
            if (syncState !== 'on' || !syncHandle) return;
            const snap = await syncReadFile();
            if (!snap || !snap.data) { noticeModal('The data file is empty or unreadable.', 'Sync'); return; }
            const fileWhen = snap._meta && snap._meta.savedAt ? new Date(snap._meta.savedAt).toLocaleString() : 'unknown time';
            confirmModal(`Replace this computer's data with the file's data (saved ${esc(fileWhen)})?`, function() {
                applySyncSnapshot(snap);
                render();
                toast('Loaded latest data from ' + syncFileName + '.');
            }, { title: 'Load from file', yesLabel: 'Load' });
        }

        function syncSaveNow() {
            syncWriteNow().then(() => toast('Saved to ' + syncFileName + '.'));
        }

        function syncDisconnect() {
            confirmModal('Disconnect the data file? This computer keeps its data, but changes will no longer be saved to the file.', async function() {
                syncHandle = null;
                syncState = 'off';
                syncFileName = '';
                try { await idbDel('handle'); } catch (e) {}
                updateSyncBadge();
                render();
                toast('Data file disconnected.');
            }, { danger: true, title: 'Disconnect sync', yesLabel: 'Disconnect' });
        }

        function updateSyncBadge() {
            const el = document.getElementById('sync-badge');
            if (syncState === 'on') startSyncPolling(); else stopSyncPolling();
            if (!el) return;
            el.classList.remove('pending');
            if (syncState === 'on') {
                el.style.display = 'inline-block';
                el.textContent = '🔄 Synced';
                el.title = 'Saving to ' + syncFileName + (lastSyncSavedAt ? ' · last saved ' + lastSyncSavedAt : '') + ' · click for settings';
            } else if (syncState === 'pending') {
                el.style.display = 'inline-block';
                el.textContent = '🔄 Reconnect';
                el.title = 'Click to reconnect your data file';
                el.classList.add('pending');

        }

        // On startup: if a handle was stored, show "Reconnect" (browsers require a user click to re-grant access)
        (async function syncStartup() {
            if (!window.showSaveFilePicker || !window.indexedDB) return;
            try {
                const h = await idbGet('handle');
                if (h) {
                    syncHandle = h;
                    syncFileName = h.name || 'data file';
                    const ok = await syncPermission(h, false);
                    if (ok) {
                        // Permission persisted — load the file silently if it's newer
                        const snap = await syncReadFile();
                        if (snap && snap.data && snap._meta && snap._meta.savedAt) {
                            const localSaved = loadOr('hms_last_saved', null);
                            if (!localSaved || new Date(snap._meta.savedAt) > new Date(localSaved)) {
                                applySyncSnapshot(snap);
                            }
                        }
                        syncState = 'on';
                        render();
                    } else {
                        syncState = 'pending';
                    }
                    updateSyncBadge();
                }
            } catch (e) {}
        })();

        //  ARCHIVE FUNCTIONS
        // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
        function archiveMonth(month) {
            // Find all cashbook entries with that month that are not archived
            const toArchive = cashbook.filter(e => e.month === month && !e.archived);
            if (toArchive.length === 0) return false;
            // Mark them as archived
            toArchive.forEach(e => e.archived = true);
            // Add to archivedCashbooks if not exists
            if (!archivedCashbooks[month]) {
                archivedCashbooks[month] = { verified: false, verifiedBy: '' };
            }
            save();
            return true;
        }

        function autoArchive() {
            const todayStr = today();
            if (!isFirstMonday(todayStr)) return;
            const prevMonth = getPreviousMonth();
            // Check if already archived
            if (archivedCashbooks[prevMonth]) return;
            // Check if there are entries for that month
            const hasEntries = cashbook.some(e => e.month === prevMonth && !e.archived);
            if (!hasEntries) return;
            // Archive
            const success = archiveMonth(prevMonth);
            if (success) {
                toast(`Archived cash book for ${prevMonth}`);
            }
        }

        function getCurrentMonthEntries() {
            const current = getCurrentMonth();
            return cashbook.filter(e => !e.archived && getMonthFromDate(e.date) === current);
        }

        function getArchivedMonths() {
            return Object.keys(archivedCashbooks).sort((a, b) => {
                const [mA, yA] = a.split('/');
                const [mB, yB] = b.split('/');
                if (yA !== yB) return parseInt(yA) - parseInt(yB);
                return parseInt(mA) - parseInt(mB);
            });
        }

        function verifyMonth(month, verifier) {
            if (archivedCashbooks[month]) {
                archivedCashbooks[month].verified = true;
                archivedCashbooks[month].verifiedBy = verifier;
                save();
                toast(`Month ${month} verified by ${verifier}`);
                render();
            }
        }

        // ─── ANALYTICS ──────────────────────────────────────────
        // ─── DAILY BUSINESS TIP ────────────────────────────────

            'Keep a reliable generator ready — dependable power during load-shedding is a real selling point.',
