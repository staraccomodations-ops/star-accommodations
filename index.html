        // ─── REDEEM POINTS ─────────────────────────────────────
        function openRedeemPoints(guestId) {
            const g = byId(guests, guestId);
            if (!g) { noticeModal('Guest not found.', 'Redeem points'); return; }
            const bal = g.points || 0;
            if (bal <= 0) { noticeModal(`${esc(g.name)} has no points to redeem yet.`, 'Redeem points'); return; }
            const rewardOpts = redeemRules.rewards
                .map(r => `<option value="${esc(r)}">${esc(r)}</option>`).join('');
            const minNote = redeemRules.minPoints > 0 ? ` Minimum redemption is ${redeemRules.minPoints.toLocaleString()} points (${freeRoomLabel()}).` : '';
            const b =
                `<div class="alert alert-info" style="margin-bottom:14px;">Redeem loyalty points for a reward. This deducts points and records a booking on the guest's account as proof.${minNote}</div>` +
                `<div class="stat-row"><span class="text-secondary">Guest</span><span style="font-weight:700;">${esc(g.name)}</span></div>` +
                `<div class="stat-row"><span class="text-secondary">Current balance</span><span style="font-weight:700;">${bal.toLocaleString()} pts</span></div>` +
                `<div class="stat-row" style="margin-bottom:10px;"><span class="text-secondary">Redeemable value</span><span style="font-weight:700;">${PKR(pointsValue(bal))}</span></div>` +
                `<div class="form-group"><label>Redeem for</label><select id="rp-reward">${rewardOpts}</select></div>` +
                `<div class="form-group"><label>Points to redeem *</label><input type="number" min="1" max="${bal}" id="rp-pts" placeholder="Max ${bal.toLocaleString()}"></div>` +
                `<div class="form-group"><label>Note (optional)</label><input id="rp-note" placeholder="e.g. Redeemed at front desk"></div>` +
                `<div class="total-preview"><div class="line"><span>Points to redeem</span><span id="rp-out">0 pts</span></div><div class="line"><span>Reward value</span><span id="rp-val">Rs. 0</span></div><div class="line total"><span>New balance</span><span id="rp-newbal">${bal.toLocaleString()} pts</span></div></div>`;
            const ov = modal('🎁 Redeem Points', b, function(ov) {
                const pts = Math.floor(parseFloat(ov.querySelector('#rp-pts').value));
                if (!pts || pts <= 0) { noticeModal('Enter how many points to redeem.', 'Redeem points'); return false; }
                if (pts > bal) { noticeModal(`Only ${bal.toLocaleString()} points are available.`, 'Redeem points'); return false; }
                if (redeemRules.minPoints > 0 && pts < redeemRules.minPoints) { noticeModal(`Minimum redemption is ${redeemRules.minPoints.toLocaleString()} points.`, 'Redeem points'); return false; }
                const reward = ov.querySelector('#rp-reward').value;
                const note = ov.querySelector('#rp-note').value.trim();
                g.points = bal - pts;
                g.lastVisit = today();
                const desc = reward + (note ? ' — ' + note : '');
                const entry = {
                    id: uid(), gId: g.id, nonMember: false,
                    type: 'Points Redemption', desc: desc, date: today(),
                    nights: 0, amount: 0, paid: 0, balance: 0, pts: 0,
                    redemption: true, pointsRedeemed: pts, pointsValue: pointsValue(pts),
                    pointsBalanceAfter: g.points, reward: reward
                };
                txs.unshift(entry);
                save();
                render();

                `<div class="form-group"><label>Rewards (one per line)</label><textarea id="rr-rewards" rows="6" style="width:100%;padding:10px;border:1px solid var(--border);border-radius:var(--radius-sm);font-family:inherit;font-size:14px;resize:vertical;background:var(--surface);color:var(--text);">${esc(redeemRules.rewards.join('\n'))}</textarea></div>` +

        // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
        //  ADMIN TOGGLE
        // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
        function toggleAdminFromButton() {

        // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
        //  MODAL
        // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
        function modal(title, bodyHtml, onSave, saveLabel) {
            const ov = document.createElement('div');
            ov.className = 'modal-overlay';
            ov.innerHTML =
                `<div class="modal"><div class="modal-title">${title}</div><div id="modal-body">${bodyHtml}</div><div class="modal-footer"><button class="btn" id="m-cancel">Cancel</button><button class="btn btn-gold" id="m-save">${saveLabel||'Save'}</button></div></div>`;
            ov.onclick = function(e) { if (e.target === ov && document.body.contains(ov)) document.body.removeChild(ov); };
            document.body.appendChild(ov);
            // Reference buttons directly (not via #id) so stacked modals with duplicate ids still work
            const footer = ov.querySelector('.modal-footer');
            const cancelBtn = footer.firstElementChild;
            const saveBtn = footer.lastElementChild;
            ov._cancelBtn = cancelBtn;
            ov._saveBtn = saveBtn;
            cancelBtn.onclick = function() { if (document.body.contains(ov)) document.body.removeChild(ov); };
            saveBtn.onclick = function() { if (onSave(ov) !== false && document.body.contains(ov)) document.body.removeChild(ov); };
            return ov;
        }

        // Modal-based confirm/notice so actions don't depend on native browser dialogs
        function confirmModal(message, onYes, opts) {
            opts = opts || {};
            const body = `<div class="alert ${opts.danger ? 'alert-danger' : 'alert-info'}" style="margin-bottom:2px;">${message}</div>`;
            const ov = modal(opts.title || 'Please confirm', body, function() { onYes(); return true; }, opts.yesLabel || 'Confirm');
            const sb = ov._saveBtn;
            if (opts.danger && sb) { sb.classList.remove('btn-gold'); sb.classList.add('btn-danger'); }
            return ov;
        }

        function noticeModal(message, title) {
            const body = `<div class="alert alert-info" style="margin-bottom:2px;">${message}</div>`;
            const ov = modal(title || 'Notice', body, function() { return true; }, 'OK');
            if (ov._cancelBtn) ov._cancelBtn.style.display = 'none';
            return ov;
        }

        // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
        //  REPLENISH PETTY CASH (admin only)
        // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
        // ─── CASH RECONCILIATION ────────────────────────────────
        function openReconcileCash() {
            if (!adminUnlocked) {
                alert('Admin mode is required to reconcile cash.');
                return;
            }
            const bal = computeCashBalances();
            const verifierOpts = verifiers.map(v => `<option value="${esc(v)}">${esc(v)}</option>`).join('');
            const recentHtml = reconciliations.slice(0, 5).map(r => {
                const clean = Math.abs(r.generalDiff) < 1 && Math.abs(r.pettyDiff) < 1;
                return `<div style="padding:8px 10px;border-bottom:1px solid var(--border);font-size:12px;display:flex;justify-content:space-between;"><span>${esc(r.date)} · ${esc(r.by||'—')}</span><span style="color:${clean?'var(--teal)':'var(--coral)'};font-weight:600;">${clean?'✅ Matched':'⚠️ General '+PKR(r.generalDiff)+' · Petty '+PKR(r.pettyDiff)}</span></div>`;
            }).join('');
            const b =
                `<div class="alert alert-info" style="margin-bottom:14px;">Count your physical cash and compare it to what the Cash Book says. Any difference is flagged so you can catch mistakes early — and optionally correct the books to match what's actually in the drawer.</div>` +
                `<div class="grid-2" style="margin-bottom:14px;">
                    <div style="background:var(--surface-2);padding:12px;border-radius:var(--radius-sm);">
                        <div class="text-secondary" style="font-size:11px;">General Cash — System says</div>
                        <div style="font-size:18px;font-weight:700;color:var(--teal);">${PKR(bal.generalCash)}</div>
                    </div>
                    <div style="background:var(--surface-2);padding:12px;border-radius:var(--radius-sm);">
                        <div class="text-secondary" style="font-size:11px;">Petty Cash — System says</div>
                        <div style="font-size:18px;font-weight:700;color:var(--teal);">${PKR(bal.pettyCash)}</div>
                    </div>
                </div>` +
                `<div class="form-row"><div class="form-group"><label>Counted General Cash (Rs.)</label><input type="number" id="rc-general" placeholder="${bal.generalCash}"></div><div class="form-group"><label>Counted Petty Cash (Rs.)</label><input type="number" id="rc-petty" placeholder="${bal.pettyCash}"></div></div>` +
                `<div id="rc-diff" style="margin-bottom:14px;"></div>` +
                `<div class="form-row"><div class="form-group"><label>Date</label><input type="date" id="rc-date" value="${today()}"></div><div class="form-group"><label>Reconciled by</label><select id="rc-by">${verifierOpts}</select></div></div>` +
                `<div class="form-group"><label style="display:flex;align-items:center;gap:8px;font-weight:400;"><input type="checkbox" id="rc-adjust" style="width:auto;"> Post an adjustment entry to correct the books to match what I counted</label></div>` +
                (recentHtml ? `<div class="sec-title" style="font-size:13px;margin-top:10px;">Recent reconciliations</div><div style="border:1px solid var(--border);border-radius:var(--radius-sm);overflow:hidden;">${recentHtml}</div>` : '');

            const ov = modal('🧮 Reconcile Cash', b, function(ov) {
                const generalCounted = ov.querySelector('#rc-general').value === '' ? bal.generalCash : parseFloat(ov.querySelector('#rc-general').value);
                const pettyCounted = ov.querySelector('#rc-petty').value === '' ? bal.pettyCash : parseFloat(ov.querySelector('#rc-petty').value);
                const date = ov.querySelector('#rc-date').value;
                const by = ov.querySelector('#rc-by').value;
                const adjust = ov.querySelector('#rc-adjust').checked;
                const generalDiff = generalCounted - bal.generalCash;
                const pettyDiff = pettyCounted - bal.pettyCash;
                const month = getMonthFromDate(date);

                if (adjust) {
                    const adjCat = { label: 'Cash Over / Short', account: 'Cash Over / Short' };
                    if (Math.abs(generalDiff) >= 1) {
                        adjCat.dir = generalDiff < 0 ? 'out' : 'in';
                        postCashEntry(date, adjCat, Math.abs(generalDiff), 'cash', 'general', 'Reconciliation adjustment — General Cash', month);
                    }
                    if (Math.abs(pettyDiff) >= 1) {
                        adjCat.dir = pettyDiff < 0 ? 'out' : 'in';
                        postCashEntry(date, adjCat, Math.abs(pettyDiff), 'cash', 'petty', 'Reconciliation adjustment — Petty Cash', month);
                    }
                }

                reconciliations.unshift({
                    id: uid(), date, by,
                    generalSystem: bal.generalCash, generalCounted, generalDiff,
                    pettySystem: bal.pettyCash, pettyCounted, pettyDiff,
                    adjusted: adjust
                });
                saveReconciliations();
                save();
                render();
                const clean = Math.abs(generalDiff) < 1 && Math.abs(pettyDiff) < 1;
                toast(clean ? '✅ Reconciled — everything matches.' : (adjust ? 'Reconciled — books adjusted to match your count.' : 'Reconciled — difference logged, books unchanged.'));
                return true;
            }, 'Save Reconciliation');

            function updateDiff() {
                const gInput = ov.querySelector('#rc-general').value;
                const pInput = ov.querySelector('#rc-petty').value;
                const gCounted = gInput === '' ? bal.generalCash : parseFloat(gInput) || 0;
                const pCounted = pInput === '' ? bal.pettyCash : parseFloat(pInput) || 0;
                const gDiff = gCounted - bal.generalCash;
                const pDiff = pCounted - bal.pettyCash;
                function line(label, diff) {
                    if (Math.abs(diff) < 1) return `<div style="font-size:12px;color:var(--teal);">✅ ${label}: matches exactly.</div>`;
                    const word = diff < 0 ? 'Shortage' : 'Overage';
                    return `<div style="font-size:12px;color:var(--coral);font-weight:600;">⚠️ ${label}: ${word} of ${PKR(Math.abs(diff))}.</div>`;
                }
                ov.querySelector('#rc-diff').innerHTML = line('General Cash', gDiff) + line('Petty Cash', pDiff);
            }
            ov.querySelector('#rc-general').addEventListener('input', updateDiff);
            ov.querySelector('#rc-petty').addEventListener('input', updateDiff);
            updateDiff();
        }

        function openReplenishPettyCash() {

                    date: date,
                    desc: desc + ' (transfer out)',
                    catLabel: 'Transfer to Petty Cash',
                    account: 'General Cash',
                    dir: 'out',
                    method: 'cash',
                    amount: amt,
                    ref: ref,
                    cashType: 'general',
                    month: month,
                    archived: false,
                    isReplenish: true,

                    id: id2,
                    seq: cbSeq,
                    date: date,
                    desc: desc + ' (transfer in)',
                    catLabel: 'Transfer from General Cash',
                    account: 'Petty Cash',
                    dir: 'in',
                    method: 'cash',
                    amount: amt,
                    ref: ref,
                    cashType: 'petty',

                const note = desc + ' (replenishment)';
                journal.unshift({ id: uid(), date: date, ref: ref, account: 'Petty Cash', desc: note, dr: amt,

                    cr: amt, source: 'cashbook', cbId: id1 });

                    phone,
                    email: ov.querySelector('#g-email').value.trim(),
                    notes: ov.querySelector('#g-notes').value.trim(),
                    spend: 0,
                    points: 0,
                    nights: 0,
                    stays: 0,
                    lastVisit: '-',
                    joined: today()
                });
                save();
                render();
                toast('Guest registered successfully.');
            });
        }

        // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
        //  ADD BOOKING – with payment tracking
        // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
        // ─── COMPANIES (special-rate accounts) ─────────────────
        function openManageCompanies() {
            const b =
                `<div class="alert alert-info" style="margin-bottom:14px;">Companies get their own negotiated room rate instead of the member discount, and don't earn or redeem points. Set the rate here — it's used to prefill new bookings for that company, and can be changed any time (existing bookings keep their original rate).</div>` +
                `<div id="co-rows"></div>` +
                `<button type="button" class="btn btn-sm" id="co-add" style="margin-top:4px;">➕ Add Company</button>`;
            const ov = modal('🏢 Manage Companies', b, function(ov) {
                const rows = [...ov.querySelectorAll('.co-row')];
                const list = [];
                for (const r of rows) {
                    const name = r.querySelector('.co-name').value.trim();
                    const rateStr = r.querySelector('.co-rate').value;
                    if (!name && !rateStr) continue; // skip fully blank rows
                    if (!name) { noticeModal('Enter a name for every company, or remove the empty row.', 'Companies'); return false; }
                    const rate = parseFloat(rateStr);
                    if (isNaN(rate) || rate < 0) { noticeModal(`Enter a valid rate for "${esc(name)}".`, 'Companies'); return false; }
                    list.push({ id: r.dataset.id || uid(), name: name, rate: rate });
                }
                companies = list;
                saveCompanies();
                render();
                toast('Companies updated.');
                return true;
            }, 'Save');
            const rowsWrap = ov.querySelector('#co-rows');

            function addRow(company) {
                const row = document.createElement('div');
                row.className = 'co-row';
                row.style.cssText = 'display:flex;gap:8px;align-items:flex-end;margin-bottom:10px;';
                if (company && company.id) row.dataset.id = company.id;
                row.innerHTML =
                    `<div class="form-group" style="flex:2;margin:0;"><label style="font-size:11px;">Company name</label><input class="co-name" placeholder="e.g. Acme Textiles" value="${company?esc(company.name):''}"></div>` +
                    `<div class="form-group" style="flex:1;margin:0;"><label style="font-size:11px;">Rate (Rs./room/night)</label><input class="co-rate" type="number" min="0" placeholder="e.g. 4500" value="${company?company.rate:''}"></div>` +
                    `<button type="button" class="btn btn-sm btn-danger co-del" title="Remove">✕</button>`;
                row.querySelector('.co-del').onclick = function() { row.remove(); };
                rowsWrap.appendChild(row);
            }
            companies.forEach(c => addRow(c));
            if (!companies.length) addRow(null);
            ov.querySelector('#co-add').onclick = function() { addRow(null); };
        }

        function openAddTx() {
            const b =
                `<div class="alert alert-info" style="margin-bottom:14px;">Fill in the booking details. Members get a 10% discount automatically (except during blackout period) and earn ${earnRateLabel()}. Non‑members get no discount or points, but you must enter a guest name. Enter the amount paid by the customer; the balance will be calculated.</div>` +
                `<div class="form-group"><label>Guest *</label><div class="ac-wrap"><input id="t-guest-input" autocomplete="off" spellcheck="false" placeholder="Type to search guest..."><div id="t-guest-list" class="ac-list" style="display:none;"></div></div><div id="t-guest-preview" class="text-muted" style="font-size:12px;margin-top:4px;">Start typing to select a guest, or pick "Non-member".</div></div>` +
                `<div id="t-nonmember-name-group" style="display:none; margin-bottom:12px;"><div class="form-group"><label>Guest Name *</label><input id="t-nonmember-name" placeholder="Enter guest name..."></div></div>` +
                `<div class="form-row"><div class="form-group"><label>Number of Rooms</label><select id="t-rooms"><option value="1">1</option><option value="2">2</option><option value="3">3</option><option value="4">4</option><option value="5">5</option><option value="6">6</option><option value="7">7</option><option value="8">8</option><option value="9">9</option></select></div><div class="form-group"><label>Price per Room (Rs.)</label><input type="number" min="0" id="t-price" placeholder="e.g. 5000"></div></div>` +
                `<div class="form-row"><div class="form-group"><label>Number of Nights</label><input type="number" min="1" id="t-nights" value="1"></div><div class="form-group"><label>Date</label><input type="date" id="t-date" value="${today()}"></div></div>` +
                `<div id="t-discount-section" style="display:none; margin-bottom:12px; padding:12px; background:var(--surface-2); border-radius:var(--radius-sm); border-left:3px solid var(--gold);"><div class="text-secondary" style="font-size:12px;">✅ Member discount (10%) automatically applied.</div></div>` +
                `<div class="total-preview" id="t-total-preview">
                    <div class="line"><span>Subtotal</span><span id="t-subtotal">Rs. 0</span></div>
                    <div class="line discount-line" id="t-discount-line" style="display:none;"><span>Discount (10%)</span><span id="t-discount-amount">-Rs. 0</span></div>
                    <div class="line total"><span>Total</span><span id="t-total">Rs. 0</span></div>
                    <div class="line"><span>Amount Paid by Customer</span><input type="number" min="0" id="t-paid" value="0" style="width:120px;display:inline-block;text-align:right;"></div>
                    <div class="line" style="font-weight:bold;color:var(--teal);"><span>Balance Owed</span><span id="t-balance">Rs. 0</span></div>
                    <div class="line"><span>Points to earn</span><span id="t-points">0</span></div>
                </div>` +
                `<div class="form-group"><label>Description</label><input id="t-desc" placeholder="e.g. Deluxe Room - 2 nights"></div>`;

            let selectedGuest = null;
            let selectedGuestId = null;

            const ov = modal('📅 New Booking', b, function(ov) {
                const guestId = selectedGuestId;
                const amt = parseFloat(ov.querySelector('#t-price').value);
                const nights = parseInt(ov.querySelector('#t-nights').value) || 1;
                const rooms = parseInt(ov.querySelector('#t-rooms').value) || 1;
                if (!guestId && guestId !== 'nonmember') { alert('Please select a guest, a company, or choose Non-member.'); return false; }
                if (!amt || amt <= 0) { alert('Please enter a valid price per room.'); return false; }

                const isNonMember = guestId === 'nonmember';
                const isCompany = typeof guestId === 'string' && guestId.indexOf('company:') === 0;
                let g = null;
                let company = null;
                let pts = 0;
                let totalAmount = 0;
                const discountPercent = 10;
                const subtotal = amt * rooms * nights;
                let nonMemberName = '';
                let paid = parseFloat(ov.querySelector('#t-paid').value) || 0;

                if (isCompany) {
                    company = byId(companies, guestId.slice('company:'.length));
                    if (!company) { alert('Company not found.'); return false; }
                    totalAmount = subtotal;
                    pts = 0;
                } else if (!isNonMember) {
                    g = byId(guests, parseInt(guestId));
                    if (!g) { alert('Guest not found.'); return false; }
                    resetTierIfInactive(g);
                    const date = ov.querySelector('#t-date').value;
                    const blackout = isBlackoutPeriod(date);
                    let finalDiscount = 0;
                    if (!blackout) {
                        finalDiscount = discountPercent;
                    }
                    const discountAmount = subtotal * (finalDiscount / 100);
                    totalAmount = subtotal - discountAmount;
                    pts = earnPointsForBooking(rooms);
                } else {
                    nonMemberName = ov.querySelector('#t-nonmember-name').value.trim();
                    if (!nonMemberName) {
                        alert('Please enter the guest name for non-member booking.');
                        ov.querySelector('#t-nonmember-name').focus();
                        return false;
                    }
                    totalAmount = subtotal;
                    pts = 0;
                }

                const balance = totalAmount - paid;

                const entry = {
                    id: Date.now(),
                    gId: isNonMember || isCompany ? null : parseInt(guestId),
                    date: ov.querySelector('#t-date').value,
                    type: 'Room Revenue',
                    amount: totalAmount,
                    desc: ov.querySelector('#t-desc').value || `${rooms} room(s) for ${nights} nights`,
                    pts: pts,
                    nights: nights,
                    nonMember: isNonMember,
                    nonMemberName: nonMemberName,
                    isCompany: isCompany,
                    companyId: isCompany ? company.id : null,
                    companyName: isCompany ? company.name : '',
                    rooms: rooms,
                    pricePerRoom: amt,
                    subtotal: subtotal,
                    discountPercent: (!isNonMember && !isCompany) ? discountPercent : 0,
                    discountApplied: (!isNonMember && !isCompany && !isBlackoutPeriod(ov.querySelector('#t-date').value)) ? discountPercent :
                        0,
                    paid: paid,
                    balance: balance,
                    cashEntryId: null
                };

                // If paid > 0, create cash entry
                if (paid > 0) {
                    const date = entry.date;
                    const month = getMonthFromDate(date);
                    // Create cash entry for Room income
                    cbSeq++;
                    try { localStorage.setItem('hms_cbseq', JSON.stringify(cbSeq)); } catch (e) {}
                    const ref = 'CB-' + pad3(cbSeq);
                    const cashId = uid();
                    const cat = getCashCategories().find(c => c.label === 'Room income');
                    if (cat) {
                        const cashAcct = 'General Cash'; // default
                        cashbook.unshift({
                            id: cashId,
                            seq: cbSeq,
                            date: date,
                            desc: `Payment for booking ${entry.id}`,
                            catLabel: cat.label,
                            account: cat.account,
                            dir: 'in',
                            method: 'cash',
                            amount: paid,
                            ref: ref,
                            cashType: 'general',
                            month: month,
                            archived: false
                        });
                        // Journal entries
                        journal.unshift({ id: uid(), date: date, ref: ref, account: cashAcct, desc: 'Payment for booking',
                            dr: paid, cr: 0, source: 'cashbook', cbId: cashId });
                        journal.unshift({ id: uid(), date: date, ref: ref, account: cat.account, desc: 'Payment for booking',
                            dr: 0, cr: paid, source: 'cashbook', cbId: cashId });
                        entry.cashEntryId = cashId;
                    } else {
                        toast('Warning: "Room income" category not found. Payment not recorded in cash book.');
                    }
                }

                txs.unshift(entry);

                if (!isNonMember && !isCompany) {
                    g.spend += totalAmount;
                    g.points += pts;
                    g.nights = (g.nights || 0) + nights;
                    g.stays = (g.stays || 0) + 1;
                    g.lastVisit = entry.date;
                }
                save();
                render();
                toast(isCompany ? `Company booking saved for ${company.name}.` :
                    isNonMember ? `Non-member booking saved for ${nonMemberName}.` :
                    `Booking saved. ${pts.toLocaleString()} points awarded.`);
                return true;
            });

            // ─── Autocomplete for guest ────────────────────────
            const input = ov.querySelector('#t-guest-input');
            const list = ov.querySelector('#t-guest-list');
            const preview = ov.querySelector('#t-guest-preview');
            const nonMemberGroup = ov.querySelector('#t-nonmember-name-group');

            function renderGuestAC() {
                const q = input.value.toLowerCase().trim();
                let matches = [];
                matches.push({ label: '🚶 Non-member (no points)', id: 'nonmember' });
                companies.forEach(c => {
                    if (c.name.toLowerCase().indexOf(q) >= 0) {
                        matches.push({ label: '🏢 ' + c.name + ' (Company rate)', id: 'company:' + c.id });
                    }
                });
                guests.forEach(g => {
                    if (g.name.toLowerCase().indexOf(q) >= 0 || (g.phone && g.phone.indexOf(q) >= 0) || (g
                            .email && g.email.toLowerCase().indexOf(q) >= 0)) {
                        matches.push({ label: g.name + ' (Member)', id: g.id });
                    }
                });
                if (matches.length === 0) {
                    list.innerHTML = `<div class="ac-empty">No matches. Try typing a name or phone.</div>`;
                    list.style.display = 'block';
                    return;
                }
                list.innerHTML = matches.map(m =>
                    `<div class="ac-item" data-id="${m.id}"><span>${esc(m.label)}</span></div>`
                ).join('');
                list.style.display = 'block';
                list.querySelectorAll('.ac-item').forEach(el => {
                    el.addEventListener('mousedown', function(ev) { ev.preventDefault();
                        chooseGuest(el.getAttribute('data-id')); });
                });
            }

            function chooseGuest(id) {
                if (id === 'nonmember') {
                    selectedGuestId = 'nonmember';
                    selectedGuest = null;
                    input.value = '🚶 Non-member (no points)';
                    preview.innerHTML = 'Non-member — no discount, no points. Please enter guest name.';
                    nonMemberGroup.style.display = 'block';
                    ov.querySelector('#t-discount-section').style.display = 'none';
                } else if (typeof id === 'string' && id.indexOf('company:') === 0) {
                    const cid = id.slice('company:'.length);
                    const c = byId(companies, cid);
                    if (c) {
                        selectedGuestId = 'company:' + cid;
                        selectedGuest = null;
                        input.value = '🏢 ' + c.name + ' (Company rate)';
                        preview.innerHTML = `Company — no discount, no points. Rate prefilled at ${PKR(c.rate)}/room, still editable below.`;
                        nonMemberGroup.style.display = 'none';
                        ov.querySelector('#t-discount-section').style.display = 'none';
                        const priceField = ov.querySelector('#t-price');
                        if (!priceField.value || parseFloat(priceField.value) === 0) priceField.value = c.rate;
                    }
                } else {
                    const g = byId(guests, parseInt(id));
                    if (g) {
                        resetTierIfInactive(g);
                        selectedGuestId = g.id;
                        selectedGuest = g;
                        input.value = g.name + ' (Member)';
                        preview.innerHTML =
                            `Member — 10% discount, ${earnRateLabel()}. Current points: ${g.points.toLocaleString()}.`;
                        nonMemberGroup.style.display = 'none';
                        ov.querySelector('#t-discount-section').style.display = 'block';
                    }
                }
                list.style.display = 'none';
                updateTotals(ov);
            }

            input.addEventListener('focus', renderGuestAC);
            input.addEventListener('input', function() {
                selectedGuestId = null;
                selectedGuest = null;
                nonMemberGroup.style.display = 'none';
                ov.querySelector('#t-discount-section').style.display = 'none';
                renderGuestAC();
            });
            input.addEventListener('blur', function() { setTimeout(() => { list.style.display = 'none'; }, 150); });

            // ─── Total update with paid and balance ─────────────
            function updateTotals(ov) {
                const price = parseFloat(ov.querySelector('#t-price').value) || 0;
                const nights = parseInt(ov.querySelector('#t-nights').value) || 1;
                const rooms = parseInt(ov.querySelector('#t-rooms').value) || 1;
                const subtotal = price * rooms * nights;
                let discount = 0;
                let points = 0;
                let total = subtotal;
                const date = ov.querySelector('#t-date').value;
                const paid = parseFloat(ov.querySelector('#t-paid').value) || 0;

                if (selectedGuestId && selectedGuestId !== 'nonmember' && !(typeof selectedGuestId === 'string' && selectedGuestId.indexOf('company:') === 0)) {
                    const g = byId(guests, parseInt(selectedGuestId));
                    if (g) {
                        const blackout = isBlackoutPeriod(date);
                        if (!blackout) {
                            discount = subtotal * 0.10;
                            total = subtotal - discount;
                        } else {
                            discount = 0;
                            total = subtotal;
                        }
                        points = earnPointsForBooking(rooms);
                        if (blackout) {
                            ov.querySelector('#t-discount-section').innerHTML =
                                `<div class="alert alert-warning" style="margin:0;">⚠️ Blackout period (Dec 15 - Jan 15): No discount applied, but you will still earn ${earnRateLabel()}.</div>`;
                        } else {
                            ov.querySelector('#t-discount-section').innerHTML =
                                `<div class="text-secondary" style="font-size:12px;">✅ Member discount (10%) automatically applied. Points earned: ${earnRateLabel()}.</div>`;
                        }
                        ov.querySelector('#t-discount-section').style.display = 'block';
                    }
                } else if (selectedGuestId === 'nonmember' || (typeof selectedGuestId === 'string' && selectedGuestId.indexOf('company:') === 0)) {
                    points = 0;
                    discount = 0;
                    total = subtotal;
                    ov.querySelector('#t-discount-section').style.display = 'none';
                }

                const balance = total - paid;
                const balanceColor = balance > 0 ? 'var(--coral)' : 'var(--teal)';

                ov.querySelector('#t-subtotal').textContent = PKR(subtotal);
                const discountLine = ov.querySelector('#t-discount-line');
                const discountAmountSpan = ov.querySelector('#t-discount-amount');
                if (discount > 0) {
                    discountLine.style.display = 'flex';
                    discountAmountSpan.textContent = '- ' + PKR(discount);
                    ov.querySelector('#t-discount-line span:first-child').textContent = 'Discount (10%)';
                } else {
                    discountLine.style.display = 'none';
                }
                ov.querySelector('#t-total').textContent = PKR(total);
                ov.querySelector('#t-points').textContent = points.toLocaleString();
                ov.querySelector('#t-balance').textContent = PKR(balance);
                ov.querySelector('#t-balance').style.color = balanceColor;
            }

            ov.querySelector('#t-price').addEventListener('input', function() { updateTotals(ov); });
            ov.querySelector('#t-nights').addEventListener('input', function() { updateTotals(ov); });
            ov.querySelector('#t-rooms').addEventListener('change', function() { updateTotals(ov); });
            ov.querySelector('#t-date').addEventListener('change', function() { updateTotals(ov); });
            ov.querySelector('#t-paid').addEventListener('input', function() { updateTotals(ov); });

            setTimeout(() => {
                updateTotals(ov);
            }, 50);
        }

        // ─── EDIT BOOKING (with payment handling) ──────────────
        function openEditBooking(id) {
            const tx = byId(txs, id);
            if (!tx) { noticeModal('Booking not found.', 'Edit booking'); return; }
            if (tx.redemption) {
                noticeModal('This is a points redemption and can\'t be edited. To reverse it, delete the row — the redeemed points will be refunded to the guest.', 'Redemption');
                return;
            }
            if (isOlderThanWeek(tx.date) && !adminUnlocked) {
                noticeModal('This booking is older than 7 days. Switch to Admin mode to edit it.', 'Admin required');
                return;
            }
            let guestOpts = '<option value="">Select guest...</option>';
            guestOpts += `<option value="nonmember" ${tx.nonMember?'selected':''}>🚶 Non-member</option>`;
            companies.forEach(c => {
                const sel = (tx.isCompany && tx.companyId === c.id) ? 'selected' : '';
                guestOpts += `<option value="company:${c.id}" ${sel}>🏢 ${esc(c.name)} (Company rate)</option>`;
            });
            guests.forEach(g => {
                const sel = (g.id === tx.gId && !tx.nonMember && !tx.isCompany) ? 'selected' : '';
                guestOpts += `<option value="${g.id}" ${sel}>${esc(g.name)} (Member)</option>`;
            });

            const b =
                `<div class="alert alert-info" style="margin-bottom:14px;">Edit booking details. Points and guest stats will be recalculated automatically. Members get 10% discount and ${earnRateLabel()}. For non‑members, you can update the guest name. If you change the paid amount, the cash book will be updated accordingly.</div>` +
                `<div class="form-group"><label>Guest *</label><select id="e-guest">${guestOpts}</select></div>` +
                `<div id="e-nonmember-name-group" style="${tx.nonMember?'display:block':'display:none'}; margin-bottom:12px;"><div class="form-group"><label>Guest Name *</label><input id="e-nonmember-name" value="${esc(tx.nonMemberName||'')}" placeholder="Enter guest name..."></div></div>` +
                `<div class="form-row"><div class="form-group"><label>Date</label><input type="date" id="e-date" value="${esc(tx.date)}"></div><div class="form-group"><label>Number of Rooms</label><select id="e-rooms">${[1,2,3,4,5,6,7,8,9].map(r => `<option value="${r}" ${tx.rooms===r?'selected':''}>${r}</option>`).join('')}</select></div></div>` +
                `<div class="form-row"><div class="form-group"><label>Price per Room (Rs.)</label><input type="number" min="0" id="e-price" value="${tx.pricePerRoom||0}"></div><div class="form-group"><label>Number of Nights</label><input type="number" min="1" id="e-nights" value="${tx.nights||1}"></div></div>` +
                `<div id="e-discount-section" style="margin-bottom:12px; padding:12px; background:var(--surface-2); border-radius:var(--radius-sm); border-left:3px solid var(--gold);"><div class="text-secondary" style="font-size:12px;">✅ Member discount (10%) automatically applied.</div></div>` +
                `<div class="total-preview" id="e-total-preview">
                    <div class="line"><span>Subtotal</span><span id="e-subtotal">Rs. 0</span></div>
                    <div class="line discount-line" id="e-discount-line" style="display:none;"><span>Discount (10%)</span><span id="e-discount-amount">-Rs. 0</span></div>
                    <div class="line total"><span>Total</span><span id="e-total">Rs. 0</span></div>
                    <div class="line"><span>Amount Paid by Customer</span><input type="number" min="0" id="e-paid" value="${tx.paid||0}" style="width:120px;display:inline-block;text-align:right;"></div>
                    <div class="line" style="font-weight:bold;color:var(--teal);"><span>Balance Owed</span><span id="e-balance">Rs. 0</span></div>
                    <div class="line"><span>Points to earn</span><span id="e-points">0</span></div>
                </div>` +
                `<div class="form-group"><label>Description</label><input id="e-desc" value="${esc(tx.desc)}"></div>`;

            const ov = modal('✎ Edit Booking', b, function(ov) {
                const guestVal = ov.querySelector('#e-guest').value;
                const amt = parseFloat(ov.querySelector('#e-price').value);
                const nights = parseInt(ov.querySelector('#e-nights').value) || 1;
                const rooms = parseInt(ov.querySelector('#e-rooms').value) || 1;
                const date = ov.querySelector('#e-date').value;
                const isNonMember = guestVal === 'nonmember';
                const isCompany = typeof guestVal === 'string' && guestVal.indexOf('company:') === 0;
                if (!guestVal) { alert('Please select a guest.'); return false; }
                if (!amt || amt <= 0) { alert('Please enter a valid price per room.'); return false; }

                let nonMemberName = '';
                if (isNonMember) {
                    nonMemberName = ov.querySelector('#e-nonmember-name').value.trim();
                    if (!nonMemberName) {
                        alert('Please enter the guest name for non-member booking.');
                        ov.querySelector('#e-nonmember-name').focus();
                        return false;
                    }
                }
                let company = null;
                if (isCompany) {
                    company = byId(companies, guestVal.slice('company:'.length));
                    if (!company) { alert('Company not found.'); return false; }
                }

                // Remove old booking's effects from guest
                if (!tx.nonMember && !tx.isCompany) {
                    const oldG = byId(guests, tx.gId);
                    if (oldG) {
                        oldG.spend -= tx.amount;
                        oldG.points -= tx.pts || 0;
                        oldG.nights -= tx.nights || 0;
                        oldG.stays -= 1;
                    }
                }

                // Remove old cash entry if exists
                if (tx.cashEntryId) {
                    cashbook = cashbook.filter(e => e.id !== tx.cashEntryId);
                    journal = journal.filter(j => j.cbId !== tx.cashEntryId);
                }

                txs = txs.filter(t => t.id !== id);

                let g = null;
                let pts = 0;
                let totalAmount = 0;
                const subtotal = amt * rooms * nights;
                let paid = parseFloat(ov.querySelector('#e-paid').value) || 0;

                if (isCompany) {
                    totalAmount = subtotal;
                    pts = 0;
                } else if (!isNonMember) {
                    g = byId(guests, parseInt(guestVal));
                    if (!g) { alert('Guest not found.'); return false; }
                    resetTierIfInactive(g);
                    const blackout = isBlackoutPeriod(date);
                    let finalDiscount = 0;
                    if (!blackout) {
                        finalDiscount = 10;
                    }
                    const discountAmount = subtotal * (finalDiscount / 100);
                    totalAmount = subtotal - discountAmount;
                    pts = earnPointsForBooking(rooms);
                    g.spend += totalAmount;
                    g.points += pts;
                    g.nights += nights;
                    g.stays += 1;
                    g.lastVisit = date;
                } else {
                    totalAmount = subtotal;
                    pts = 0;
                }

                const balance = totalAmount - paid;
                let cashEntryId = null;

                // If paid > 0, create cash entry
                if (paid > 0) {
                    const month = getMonthFromDate(date);
                    cbSeq++;
                    try { localStorage.setItem('hms_cbseq', JSON.stringify(cbSeq)); } catch (e) {}
                    const ref = 'CB-' + pad3(cbSeq);
                    const cashId = uid();
                    const cat = getCashCategories().find(c => c.label === 'Room income');
                    if (cat) {
                        const cashAcct = 'General Cash';
                        cashbook.unshift({
                            id: cashId,
                            seq: cbSeq,
                            date: date,
                            desc: `Payment for booking ${id}`,
                            catLabel: cat.label,
                            account: cat.account,
                            dir: 'in',
                            method: 'cash',
                            amount: paid,
                            ref: ref,
                            cashType: 'general',
                            month: month,
                            archived: false
                        });
                        journal.unshift({ id: uid(), date: date, ref: ref, account: cashAcct, desc: 'Payment for booking',
                            dr: paid, cr: 0, source: 'cashbook', cbId: cashId });
                        journal.unshift({ id: uid(), date: date, ref: ref, account: cat.account, desc: 'Payment for booking',
                            dr: 0, cr: paid, source: 'cashbook', cbId: cashId });
                        cashEntryId = cashId;
                    }
                }

                const newEntry = {
                    id: id,
                    gId: (isNonMember || isCompany) ? null : parseInt(guestVal),
                    date: date,
                    type: 'Room Revenue',
                    amount: totalAmount,
                    desc: ov.querySelector('#e-desc').value.trim() || `${rooms} room(s) for ${nights} nights`,
                    pts: pts,
                    nights: nights,
                    nonMember: isNonMember,
                    nonMemberName: nonMemberName,
                    isCompany: isCompany,
                    companyId: isCompany ? company.id : null,
                    companyName: isCompany ? company.name : '',
                    rooms: rooms,
                    pricePerRoom: amt,
                    subtotal: subtotal,
                    discountPercent: (!isNonMember && !isCompany) ? 10 : 0,
                    discountApplied: (!isNonMember && !isCompany && !isBlackoutPeriod(date)) ? 10 : 0,
                    paid: paid,
                    balance: balance,
                    cashEntryId: cashEntryId
                };
                txs.unshift(newEntry);
                save();
                render();
                toast('Booking updated.');
                return true;
            });

            function updateEditTotals() {
                const guestVal = ov.querySelector('#e-guest').value;
                const amt = parseFloat(ov.querySelector('#e-price').value) || 0;
                const nights = parseInt(ov.querySelector('#e-nights').value) || 1;
                const rooms = parseInt(ov.querySelector('#e-rooms').value) || 1;
                const date = ov.querySelector('#e-date').value;
                const subtotal = amt * rooms * nights;
                let discount = 0;
                let points = 0;
                let total = subtotal;
                const paid = parseFloat(ov.querySelector('#e-paid').value) || 0;
                const nonMemberGroup = ov.querySelector('#e-nonmember-name-group');

                if (guestVal === 'nonmember') {
                    nonMemberGroup.style.display = 'block';
                    points = 0;
                    discount = 0;
                    total = subtotal;
                    ov.querySelector('#e-discount-section').style.display = 'none';
                } else if (typeof guestVal === 'string' && guestVal.indexOf('company:') === 0) {
                    nonMemberGroup.style.display = 'none';
                    points = 0;
                    discount = 0;
                    total = subtotal;
                    ov.querySelector('#e-discount-section').style.display = 'none';
                } else if (guestVal) {
                    nonMemberGroup.style.display = 'none';
                    const g = byId(guests, parseInt(guestVal));
                    if (g) {
                        const blackout = isBlackoutPeriod(date);
                        if (!blackout) {
                            discount = subtotal * 0.10;
                            total = subtotal - discount;
                        } else {
                            discount = 0;
                            total = subtotal;
                        }
                        points = earnPointsForBooking(rooms);
                        if (blackout) {
                            ov.querySelector('#e-discount-section').innerHTML =
                                `<div class="alert alert-warning" style="margin:0;">⚠️ Blackout period (Dec 15 - Jan 15): No discount applied, but you will still earn ${earnRateLabel()}.</div>`;
                        } else {
                            ov.querySelector('#e-discount-section').innerHTML =
                                `<div class="text-secondary" style="font-size:12px;">✅ Member discount (10%) automatically applied. Points earned: ${earnRateLabel()}.</div>`;
                        }
                        ov.querySelector('#e-discount-section').style.display = 'block';
                    }
                } else {
                    nonMemberGroup.style.display = 'none';
                    ov.querySelector('#e-discount-section').style.display = 'none';
                }

                const balance = total - paid;
                const balanceColor = balance > 0 ? 'var(--coral)' : 'var(--teal)';

                ov.querySelector('#e-subtotal').textContent = PKR(subtotal);
                const dl = ov.querySelector('#e-discount-line');
                const da = ov.querySelector('#e-discount-amount');
                if (discount > 0) {
                    dl.style.display = 'flex';
                    da.textContent = '- ' + PKR(discount);
                    ov.querySelector('#e-discount-line span:first-child').textContent = 'Discount (10%)';
                } else {
                    dl.style.display = 'none';
                }
                ov.querySelector('#e-total').textContent = PKR(total);
                ov.querySelector('#e-points').textContent = points.toLocaleString();
                ov.querySelector('#e-balance').textContent = PKR(balance);
                ov.querySelector('#e-balance').style.color = balanceColor;
            }

            ov.querySelector('#e-guest').onchange = updateEditTotals;
            ov.querySelector('#e-price').oninput = updateEditTotals;
            ov.querySelector('#e-nights').oninput = updateEditTotals;
            ov.querySelector('#e-rooms').onchange = updateEditTotals;
            ov.querySelector('#e-date').onchange = updateEditTotals;
            ov.querySelector('#e-paid').oninput = updateEditTotals;
            setTimeout(updateEditTotals, 50);
        }

        // ─── DELETE BOOKING ─────────────────────────────────────
        function deleteBooking(id) {
            const tx = byId(txs, id);
            if (!tx) { noticeModal('Booking not found.', 'Delete booking'); return; }
            if (isOlderThanWeek(tx.date) && !adminUnlocked) {
                noticeModal('This booking is older than 7 days. Switch to Admin mode to delete it.', 'Admin required');
                return;
            }
            const who = bookingGuestName(tx);
            const msg = tx.redemption ?
                `Delete this redemption for ${esc(who)} on ${esc(tx.date)}? ${(tx.pointsRedeemed||0).toLocaleString()} points will be refunded to the guest.` :
                `Delete this booking for ${esc(who)} on ${esc(tx.date)}? This will also revert guest stats and remove any associated cash entry.`;
            confirmModal(msg, function() {
                if (tx.redemption) {
                    const g = byId(guests, tx.gId);
                    if (g) g.points += tx.pointsRedeemed || 0;
                    txs = txs.filter(t => t.id !== id);
                    save();
                    render();
                    toast('Redemption reversed and points refunded.');
                    return;
                }
                if (!tx.nonMember && !tx.isCompany) {
                    const g = byId(guests, tx.gId);
                    if (g) {
                        g.spend -= tx.amount;
                        g.points -= tx.pts || 0;
                        g.nights -= tx.nights || 0;
                        g.stays -= 1;
                    }
                }
                // Remove cash entry if exists
                if (tx.cashEntryId) {
                    cashbook = cashbook.filter(e => e.id !== tx.cashEntryId);
                    journal = journal.filter(j => j.cbId !== tx.cashEntryId);
                }
                txs = txs.filter(t => t.id !== id);
                save();
                render();
                toast('Booking deleted.');
            }, { danger: true, title: tx.redemption ? 'Reverse redemption' : 'Delete booking', yesLabel: tx.redemption ? 'Refund' : 'Delete' });
        }

        // ─── EDIT CASH ENTRY ────────────────────────────────────
        function openEditCashEntry(id) {
            const entry = byId(cashbook, id);
            if (!entry) { alert('Entry not found.'); return; }
            if (isOlderThanWeek(entry.date) && !adminUnlocked) {
                alert('This entry is older than 7 days. You need Admin mode to edit it.');
                return;
            }
            const cats = getCashCategories();
            let catOpts = '<option value="">Select category...</option>';
            const visibleCats = adminUnlocked ? cats : cats.filter(c => c.reg === true);
            visibleCats.forEach(c => {
                const sel = (c.label === entry.catLabel) ? 'selected' : '';
                catOpts += `<option value="${esc(c.label)}" ${sel}>${esc(c.label)} (${c.dir==='in'?'In':'Out'})</option>`;
            });

            const b =
                `<div class="alert alert-info" style="margin-bottom:14px;">Edit cash entry. Changing date, amount, or category will update the ledger accordingly.</div>` +
                `<div class="form-row"><div class="form-group"><label>Date</label><input type="date" id="ce-date" value="${esc(entry.date)}"></div><div class="form-group"><label>Account</label><select id="ce-method">${PAYMENT_METHOD_OPTIONS.map(m=>`<option value="${m.value}" ${entry.method===m.value?'selected':''}>${m.label}</option>`).join('')}</select></div></div>` +
                `<div id="ce-cash-type-group" style="${entry.method==='cash' && adminUnlocked ? 'display:block' : 'display:none'}"><div class="form-group"><label>Cash Type</label><select id="ce-cash-type"><option value="general" ${entry.cashType==='general'?'selected':''}>General Cash</option><option value="petty" ${entry.cashType==='petty'?'selected':''}>Petty Cash</option></select></div></div>` +
                `<div class="form-group"><label>Category</label><select id="ce-cat">${catOpts}</select></div>` +
                `<div class="form-row"><div class="form-group"><label>Amount (Rs.)</label><input type="number" min="0" id="ce-amt" value="${entry.amount}"></div><div class="form-group"><label>Note</label><input id="ce-desc" value="${esc(entry.desc||'')}"></div></div>`;

            const ov = modal('✎ Edit Cash Entry', b, function(ov) {
                const catLabel = ov.querySelector('#ce-cat').value;
                const amt = parseFloat(ov.querySelector('#ce-amt').value);
                const date = ov.querySelector('#ce-date').value;
                const method = ov.querySelector('#ce-method').value;
                const cashType = ov.querySelector('#ce-cash-type') ? ov.querySelector('#ce-cash-type').value :
                    (adminUnlocked ? 'general' : (entry.dir === 'in' ? 'general' : 'petty'));
                const desc = ov.querySelector('#ce-desc').value.trim();
                if (!catLabel || !amt || amt <= 0) { alert('Please select a category and enter a valid amount.'); return false; }
                const cat = cats.find(c => c.label === catLabel);
                if (!cat) { alert('Category not found.'); return false; }

                journal = journal.filter(j => j.cbId !== id);
                const idx = cashbook.findIndex(e => e.id === id);
                if (idx === -1) { alert('Entry not found.'); return false; }

                let finalCashType = cashType;
                if (!adminUnlocked) {
                    finalCashType = cat.dir === 'in' ? 'general' : 'petty';
                }

                const oldEntry = cashbook[idx];
                const month = getMonthFromDate(date);
                cashbook[idx] = { ...oldEntry, date, desc, catLabel: cat.label, account: cat.account, dir: cat.dir,
                    method, amount: amt, cashType: finalCashType, month: month };
                const ref = cashbook[idx].ref;
                const cashAcct = methodAccountName(method, finalCashType);
                const note = desc || cat.label;
                if (cat.dir === 'in') {
                    journal.unshift({ id: uid(), date, ref, account: cashAcct, desc: note, dr: amt, cr: 0,
                        source: 'cashbook', cbId: id });
                    journal.unshift({ id: uid(), date, ref, account: cat.account, desc: note, dr: 0, cr: amt,
                        source: 'cashbook', cbId: id });
                } else {
                    journal.unshift({ id: uid(), date, ref, account: cat.account, desc: note, dr: amt, cr: 0,
                        source: 'cashbook', cbId: id });
                    journal.unshift({ id: uid(), date, ref, account: cashAcct, desc: note, dr: 0, cr: amt,
                        source: 'cashbook', cbId: id });
                }
                save();
                render();
                toast('Cash entry updated.');
                return true;
            });

            const methodSelect = ov.querySelector('#ce-method');
            const cashTypeGroup = ov.querySelector('#ce-cash-type-group');
            methodSelect.onchange = function() {
                if (this.value === 'cash' && adminUnlocked) {
                    cashTypeGroup.style.display = 'block';
                } else {
                    cashTypeGroup.style.display = 'none';
                }
            };
            if (!adminUnlocked) {
                cashTypeGroup.style.display = 'none';
            }
        }

        // ─── DELETE CASH ENTRY ─────────────────────────────────
        function deleteCashEntry(id) {
            const entry = byId(cashbook, id);
            if (!entry) { noticeModal('Entry not found.', 'Delete cash entry'); return; }
            if (isOlderThanWeek(entry.date) && !adminUnlocked) {
                noticeModal('This entry is older than 7 days. Switch to Admin mode to delete it.', 'Admin required');
                return;
            }
            // Check if this cash entry is linked to a booking
            const linkedBooking = txs.find(t => t.cashEntryId === id);
            if (linkedBooking) {
                noticeModal('This cash entry is the payment recorded for a booking. To remove it, delete that booking — or edit the booking to change the amount paid — on the Bookings page.', 'Linked to a booking');
                return;
            }
            let msg = 'Delete this cash book entry? It will also be removed from the ledger.';
            if ((entry.isReplenish && entry.replenishPair) || (entry.isTransfer && entry.transferPair)) {
                const pairId = entry.replenishPair || entry.transferPair;
                const pair = byId(cashbook, pairId);
                if (pair) msg = `This is part of a paired transaction. The paired entry "${esc(pair.catLabel)}" will remain. Delete this entry anyway? It will also be removed from the ledger.`;
            }
            confirmModal(msg, function() {
                cashbook = cashbook.filter(e => e.id !== id);
                journal = journal.filter(j => j.cbId !== id);
                save();
                render();
                toast('Entry deleted.');
            }, { danger: true, title: 'Delete cash entry', yesLabel: 'Delete' });
        }

        // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
        //  ADD MANUAL JOURNAL ENTRY
        // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
        function openAddJE() {
            let opts = '<option value="">Select account...</option>';
            for (const sec in coa) {
                opts += `<optgroup label="${sec}">`;
                coa[sec].accts.forEach(a => { opts +=
                        `<option value="${esc(a.name)}">[${a.code}] ${esc(a.name)}</option>`; });
                opts += `</optgroup>`;
            }
            const b =
                `<div class="alert alert-info" style="margin-bottom:14px;">For non-accountants, the Cash Book is easier — it posts here automatically. This form posts both sides of the entry together, so the ledger always stays balanced.</div>` +
                `<div class="form-row"><div class="form-group"><label>Date</label><input type="date" id="j-date" value="${today()}"></div><div class="form-group"><label>Reference No.</label><input id="j-ref" placeholder="Leave blank to auto-generate"></div></div>` +
                `<div class="form-group"><label>Debit Account * <span class="text-muted" style="font-weight:400;">(where the value comes in)</span></label><select id="j-dr-acct">${opts}</select></div>` +
                `<div class="form-group"><label>Credit Account * <span class="text-muted" style="font-weight:400;">(where the value comes from)</span></label><select id="j-cr-acct">${opts}</select></div>` +
                `<div class="form-group"><label>Amount (Rs.) *</label><input type="number" min="0" id="j-amt" placeholder="0"></div>` +
                `<div class="form-group"><label>Description</label><input id="j-desc" placeholder="Brief description"></div>` +
                `<div class="text-muted" style="font-size:12px;">Both a debit line and a matching credit line for this amount will be posted together, and can be deleted together later.</div>`;

            modal('📒 Manual Journal Entry', b, function(ov) {
                const drAcct = ov.querySelector('#j-dr-acct').value;
                const crAcct = ov.querySelector('#j-cr-acct').value;
                const amt = parseFloat(ov.querySelector('#j-amt').value) || 0;
                if (!drAcct || !crAcct) { alert('Select both a debit account and a credit account.'); return false; }
                if (drAcct === crAcct) { alert('The debit and credit accounts must be different.'); return false; }
                if (!amt || amt <= 0) { alert('Enter an amount greater than zero.'); return false; }

                const date = ov.querySelector('#j-date').value;
                const desc = ov.querySelector('#j-desc').value;
                let ref = ov.querySelector('#j-ref').value.trim();
                if (!ref) {
                    jeSeq++;
                    try { localStorage.setItem('hms_jeseq', JSON.stringify(jeSeq)); } catch (e) {}
                    ref = 'JE-' + pad3(jeSeq);
                }
                const pairId = uid();
                journal.unshift({ id: uid(), date, ref, account: drAcct, desc, dr: amt, cr: 0, source: 'manual', pairId });
                journal.unshift({ id: uid(), date, ref, account: crAcct, desc, dr: 0, cr: amt, source: 'manual', pairId });
                save();
                render();
                toast(`Journal entry ${ref} posted — both sides recorded.`);
            });
        }

        // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
        //  CASH BOOK CATEGORIES
        // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
        function getCashCategories() {
            return cashCategories || [];
        }

        // Most-used categories, derived from actual Cash Book history (always accurate, no separate counter to maintain).
        // Respects staff/admin visibility and, if given, restricts to categories the guest is currently searching for.
        function getFavoriteCategories(limit, staffOnly) {
            limit = limit || 6;
            const counts = {};
            cashbook.forEach(e => { counts[e.catLabel] = (counts[e.catLabel] || 0) + 1; });
            const cats = getCashCategories();
            const withCounts = cats
                .filter(c => !staffOnly || c.reg === true)
                .map(c => ({ cat: c, count: counts[c.label] || 0 }))
                .filter(x => x.count > 0)
                .sort((a, b) => b.count - a.count)
                .slice(0, limit)
                .map(x => x.cat);
            return withCounts;
        }

        function openAddCashCategory() {
            let accOpts = '<option value="">Select account...</option>';
            for (const sec in coa) {
                coa[sec].accts.forEach(a => {
                    accOpts += `<option value="${esc(a.name)}">[${a.code}] ${esc(a.name)}</option>`;
                });
            }
            const b =
                `<div class="alert alert-info" style="margin-bottom:14px;">Add a new category that will appear in the Cash Book dropdown. Choose the ledger account it posts to and whether it's Money In or Out. Staff/Admin toggle controls visibility in Staff mode.</div>` +
                `<div class="form-group"><label>Category Label *</label><input id="cc-label" placeholder="e.g. Petty Cash"></div>` +
                `<div class="form-group"><label>Ledger Account *</label><select id="cc-account">${accOpts}</select></div>` +
                `<div class="form-row"><div class="form-group"><label>Direction</label><select id="cc-dir"><option value="in">Money In</option><option value="out">Money Out</option></select></div><div class="form-group"><label>Access</label><select id="cc-reg"><option value="true">Staff (daily ops)</option><option value="false">Admin (executive)</option></select></div></div>`;
            modal('➕ Add Cash Category', b, function(ov) {
                const label = ov.querySelector('#cc-label').value.trim();
                const account = ov.querySelector('#cc-account').value;
                const dir = ov.querySelector('#cc-dir').value;
                const reg = ov.querySelector('#cc-reg').value === 'true';
                if (!label || !account) { alert('Please fill in label and account.'); return false; }
                if (cashCategories.some(c => c.label === label)) { alert('A category with this name already exists.'); return false; }
                cashCategories.push({ label, account, dir, reg, custom: true });
                saveCashCategories();
                render();
                toast('Cash category added.');
            });
        }

        function openEditCashCategory(idx) {
            const cat = cashCategories[idx];
            if (!cat) { noticeModal('Category not found.', 'Edit category'); return; }
            let accOpts = '';
            for (const sec in coa) {
                accOpts += `<optgroup label="${esc(sec)}">`;
                coa[sec].accts.forEach(a => {
                    accOpts += `<option value="${esc(a.name)}" ${cat.account===a.name?'selected':''}>[${a.code}] ${esc(a.name)}</option>`;
                });
                accOpts += `</optgroup>`;
            }
            const b =
                `<div class="form-group"><label>Category Label *</label><input id="cc-label" value="${esc(cat.label)}"></div>` +
                `<div class="form-group"><label>Ledger Account *</label><select id="cc-account">${accOpts}</select></div>` +
                `<div class="form-row"><div class="form-group"><label>Direction</label><select id="cc-dir"><option value="in" ${cat.dir==='in'?'selected':''}>Money In</option><option value="out" ${cat.dir==='out'?'selected':''}>Money Out</option></select></div><div class="form-group"><label>Access</label><select id="cc-reg"><option value="true" ${cat.reg?'selected':''}>Staff (daily ops)</option><option value="false" ${!cat.reg?'selected':''}>Admin (executive)</option></select></div></div>` +
                `<div class="text-muted" style="font-size:12px;">Renaming updates its item/subcategory list to match. Past Cash Book entries keep showing their original category name, so your history stays intact.</div>`;
            modal('✎ Edit Cash Category', b, function(ov) {
                const label = ov.querySelector('#cc-label').value.trim();
                const account = ov.querySelector('#cc-account').value;
                const dir = ov.querySelector('#cc-dir').value;
                const reg = ov.querySelector('#cc-reg').value === 'true';
                if (!label || !account) { alert('Please fill in label and account.'); return false; }
                const dup = cashCategories.some((c, i) => i !== idx && c.label === label);
                if (dup) { alert('A category with this name already exists.'); return false; }
                const oldLabel = cat.label;
                if (label !== oldLabel && subCategories[oldLabel]) {
                    subCategories[label] = subCategories[oldLabel];
                    delete subCategories[oldLabel];
                    saveSubCategories();
                }
                cat.label = label;
                cat.account = account;
                cat.dir = dir;
                cat.reg = reg;
                saveCashCategories();
                render();
                toast('Cash category updated.');
                return true;
            });
        }

        function deleteCashCategory(idx) {
            const cat = cashCategories[idx];
            if (!cat) { noticeModal('Category not found.', 'Delete category'); return; }
            const usageCount = cashbook.filter(e => e.catLabel === cat.label).length;
            const msg = usageCount > 0 ?
                `Delete the category "${esc(cat.label)}"? It has ${usageCount} past Cash Book ${usageCount===1?'entry':'entries'} — those will keep showing "${esc(cat.label)}" as their category, but it will no longer be available for new entries.` :
                `Delete the category "${esc(cat.label)}"? It hasn't been used yet, so nothing else is affected.`;
            confirmModal(msg, function() {
                cashCategories.splice(idx, 1);
                if (subCategories[cat.label]) {
                    delete subCategories[cat.label];
                    saveSubCategories();
                }
                saveCashCategories();
                render();
                toast('Cash category deleted.');
            }, { danger: true, title: 'Delete category', yesLabel: 'Delete' });
        }

        function openEditAccount(section, code) {
            const acct = coa[section] && coa[section].accts.find(a => a.code === code);
            if (!acct) { noticeModal('Account not found.', 'Edit account'); return; }
            const protectedAcct = PROTECTED_ACCOUNTS.indexOf(acct.name) >= 0;
            const lockNote = protectedAcct ?
                `<div class="alert alert-warning" style="margin-bottom:14px;">"${esc(acct.name)}" is a core system account used throughout the Cash Book, so its name and type can't be changed here. You can still update its opening balance.</div>` : '';
            const b = lockNote +
                `<div class="form-group"><label>Account Code</label><input value="${esc(acct.code)}" disabled style="opacity:.6;"></div>` +
                `<div class="form-group"><label>Account Name *</label><input id="ea-name" value="${esc(acct.name)}" ${protectedAcct?'disabled style="opacity:.6;"':''}></div>` +
                `<div class="form-row"><div class="form-group"><label>Type</label><select id="ea-type" ${protectedAcct?'disabled style="opacity:.6;"':''}><option value="debit" ${acct.type==='debit'?'selected':''}>Debit</option><option value="credit" ${acct.type==='credit'?'selected':''}>Credit</option></select></div><div class="form-group"><label>Opening Balance (Rs.)</label><input type="number" id="ea-opening" value="${acct.opening||0}"></div></div>` +
                (protectedAcct ? '' : `<div class="text-muted" style="font-size:12px;">Renaming this account updates every past and future journal entry and cash category linked to it, so nothing gets orphaned.</div>`);
            modal(`✎ Edit Account`, b, function(ov) {
                const newOpening = parseFloat(ov.querySelector('#ea-opening').value) || 0;
                if (protectedAcct) {
                    acct.opening = newOpening;
                    saveCoa();
                    render();
                    toast('Opening balance updated.');
                    return true;
                }
                const newName = ov.querySelector('#ea-name').value.trim();
                const newType = ov.querySelector('#ea-type').value;
                if (!newName) { alert('Account name is required.'); return false; }
                const dupName = newName !== acct.name && Object.keys(coa).some(s => coa[s].accts.some(a => a.name === newName));
                if (dupName) { alert('An account with this name already exists.'); return false; }
                const oldName = acct.name;
                if (newName !== oldName) {
                    // Cascade the rename so no journal line or cash category is left pointing at the old name.
                    journal.forEach(j => { if (j.account === oldName) j.account = newName; });
                    cashCategories.forEach(c => { if (c.account === oldName) c.account = newName; });
                }
                acct.name = newName;
                acct.type = newType;
                acct.opening = newOpening;
                saveCoa();
                saveCashCategories();
                save();
                render();
                toast(newName !== oldName ? `Account renamed to "${newName}" — linked entries updated.` : 'Account updated.');
                return true;
            });
        }

        function deleteAccount(section, code) {
            const acct = coa[section] && coa[section].accts.find(a => a.code === code);
            if (!acct) { noticeModal('Account not found.', 'Delete account'); return; }
            if (PROTECTED_ACCOUNTS.indexOf(acct.name) >= 0) {
                noticeModal(`"${esc(acct.name)}" is a core system account and can't be deleted.`, 'Protected account');
                return;
            }
            const usedInJournal = journal.some(j => j.account === acct.name);
            const linkedCats = cashCategories.filter(c => c.account === acct.name);
            if (usedInJournal) {
                noticeModal(`"${esc(acct.name)}" has journal entries recorded against it, so it can't be deleted (this protects your historical records). If you no longer need it, you can still stop using it going forward.`, 'Account has activity');
                return;
            }
            if (linkedCats.length) {
                noticeModal(`"${esc(acct.name)}" is still linked to ${linkedCats.length} Cash Book ${linkedCats.length===1?'category':'categories'} (${linkedCats.map(c=>esc(c.label)).join(', ')}). Edit or delete ${linkedCats.length===1?'that category':'those categories'} first, then delete this account.`, 'Account in use');
                return;
            }
            confirmModal(`Delete the account "${esc(acct.name)}" [${esc(acct.code)}]? This can't be undone.`, function() {
                coa[section].accts = coa[section].accts.filter(a => a.code !== code);
                saveCoa();
                render();
                toast('Account deleted.');
            }, { danger: true, title: 'Delete account', yesLabel: 'Delete' });
        }

        function openAddAccount(section) {
            const b =
                `<div class="form-group"><label>Account Code *</label><input id="ac-code" placeholder="e.g. 7001"></div>` +
                `<div class="form-group"><label>Account Name *</label><input id="ac-name" placeholder="e.g. New Revenue Account"></div>` +
                `<div class="form-row"><div class="form-group"><label>Type</label><select id="ac-type"><option value="debit">Debit</option><option value="credit">Credit</option></select></div><div class="form-group"><label>Opening Balance (Rs.)</label><input type="number" id="ac-opening" value="0"></div></div>` +
                `<div class="text-muted" style="font-size:12px;">Opening balance is useful if you're starting to track an account that already has a balance (e.g. migrating from paper records).</div>`;
            modal(`➕ Add Account to ${section}`, b, function(ov) {
                const code = ov.querySelector('#ac-code').value.trim();
                const name = ov.querySelector('#ac-name').value.trim();
                const type = ov.querySelector('#ac-type').value;
                const opening = parseFloat(ov.querySelector('#ac-opening').value) || 0;
                if (!code || !name) { alert('Code and name are required.'); return false; }
                if (!coa[section]) { alert('Section not found.'); return false; }
                const dup = coa[section].accts.some(a => a.code === code);
                if (dup) { alert('Account code already exists in this section.'); return false; }
                const dupName = coa[section].accts.some(a => a.name === name) || Object.keys(coa).some(s => coa[s].accts.some(a => a.name === name));
                if (dupName) { alert('An account with this name already exists.'); return false; }
                coa[section].accts.push({ code, name, type, opening });
                saveCoa();
                render();
                toast(`Account ${name} added to ${section}.`);
            });
        }

        // ─── CASH ENTRY ────────────────────────────────────────
        function openCashEntry(presetCategoryLabel) {
            const cats = getCashCategories();
            const favorites = getFavoriteCategories(6, !adminUnlocked);
            const favChipsHtml = favorites.length ?
                `<div class="form-group"><label style="font-size:11px;color:var(--text-muted);">⭐ Frequently used</label><div class="flex gap-8" style="flex-wrap:wrap;" id="cb-favs">${favorites.map(c=>`<button type="button" class="fav-chip" data-label="${esc(c.label)}">${esc(c.label)}</button>`).join('')}</div></div>` : '';
            let b =
                `<div class="alert alert-info" style="margin-bottom:14px;">Record money coming in or going out. Choose from the list — categories are drawn from your Chart of Accounts. <strong>${adminUnlocked?'🔓 Admin mode (all categories)':'🔒 Staff mode (daily operations)'}</strong></div>` +
                `<div class="form-row"><div class="form-group"><label>Date</label><input type="date" id="cb-date" value="${today()}"></div><div class="form-group"><label>Account</label><select id="cb-method">${PAYMENT_METHOD_OPTIONS.map(m=>`<option value="${m.value}">${m.label}</option>`).join('')}</select></div></div>` +
